{% extends "base.html" %}
{% block title %}有給申請 — 勤務変更申請・承認システム{% endblock %}
{% block content %}
<div class="card">
  <h2>有給休暇申請</h2>
  <p class="hint">開始日〜終了日の全日程が1件の申請としてまとめて登録されます。(最大31日分。1日だけの場合は開始日・終了日を同じ日にしてください)</p>
  <form method="post">
    <label for="applicant">申請者氏名</label>
    <input list="staff-list" id="applicant" name="applicant" required autocomplete="off">
    <datalist id="staff-list">
      {% for s in staff_list %}<option value="{{ s }}">{% endfor %}
    </datalist>

    <label for="password">パスワード</label>
    <input type="password" id="password" name="password" required>

    <div class="grid-2">
      <div>
        <label for="start_date">開始日</label>
        <input type="date" id="start_date" name="start_date" required>
      </div>
      <div>
        <label for="end_date">終了日</label>
        <input type="date" id="end_date" name="end_date" required>
      </div>
    </div>

    <label for="reason">理由(任意)</label>
    <textarea id="reason" name="reason"></textarea>

    <button type="submit">有給を申請する</button>
  </form>
</div>
{% endblock %}
