{% extends "base.html" %}
{% block title %}超過勤務申請 — 勤務変更申請・承認システム{% endblock %}
{% block content %}
<div class="card">
  <h2>超過勤務(残業)申請</h2>
  <p class="hint">承認されると、シフト表の対象日のセルの末尾に残業時間が追記されます。(例: 日勤 → 日勤(残1時間30分))</p>
  <form method="post">
    <label for="applicant">申請者氏名</label>
    <input list="staff-list" id="applicant" name="applicant" required autocomplete="off">
    <datalist id="staff-list">
      {% for s in staff_list %}<option value="{{ s }}">{% endfor %}
    </datalist>

    <label for="password">パスワード</label>
    <input type="password" id="password" name="password" required>

    <label for="target_date">対象日</label>
    <input type="date" id="target_date" name="target_date" required>

    <div class="grid-2">
      <div>
        <label for="start_time">開始時刻</label>
        <input type="time" id="start_time" name="start_time" step="900" required>
      </div>
      <div>
        <label for="end_time">終了時刻</label>
        <input type="time" id="end_time" name="end_time" step="900" required>
      </div>
    </div>

    <label for="reason">理由(任意)</label>
    <textarea id="reason" name="reason"></textarea>

    <button type="submit">残業を申請する</button>
  </form>
</div>
{% endblock %}
