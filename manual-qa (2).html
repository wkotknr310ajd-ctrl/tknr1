リネンマニュアル：外部業者「みどりの家」と契約。月・水・金の定期交換、汚れ物の仕分け・表示ルール、季節ごと（タオルケット・毛布・中掛け）の入れ替えスケジュールあり。

理容マニュアル：2つの理容店と契約（奇数月・偶数月で交代）。予約チェック表の掲示、料金請求のタイミング、支払い時の領収書確認まで手順化。

事故・ヒヤリハット・無届外出が発生した場合の流れ：問題発生→その場での対応・記録→保護者への報告→当日中にリスク検討会議を開催（当事者職員＋上司・主任・リスク管理係、最低3名）→日誌に「リスク検討会議：」と明記して記録→主任以上が報告書を作成し日誌展開→支援課会議等で再検討。

月次のルーティン：日誌確認→毎月16日頃にヒヤリハットを前期・後期でまとめる→集計表作成→係内分析→支援課会議で報告→決裁。
事故かヒヤリハットかの判断基準が種別ごとに詳細に定められている（例：服薬ミスは5分以内なら飲み直してヒヤリハット、30分以内は看護師確認の上ヒヤリハット。転倒・熱傷・誤嚥・異食・粗暴行為・自傷・溺水・無届外出などそれぞれに基準あり）。

コピー代マニュアル：Excel上の金額表・領収書シートへ入力し、20日締めで徴収したお金を管理担当者へ引き渡す。
ファイル作成マニュアル：テプラで年度更新用ラベルを作成。専用データ原本を印刷して確認→専用PC限定のテプラ本体で印刷。
点呼簿マニュアル：避難訓練・乗り物利用時の点呼簿を、変更シートで更新→各シートに反映確認→印刷。
担当引き継ぎ書マニュアル：1月中旬に周知→3月15日締切→提出物チェック（受給者証と照合）→入所主任・サビ管への回覧→決裁→ファイル保管・周知、という年間サイクル。

■経理・管理
予算の執行事務、経理及び決算、給与及び旅費、社会保険及び労働保険、支援費及び利用料の収納、寄付金・寄付物品等の管理、利用者の預り金（預金払戻等）、小口現金の出納事務。

■施設管理
文書等の収受発送及び整理保管、施設の維持管理及び保全、燃料の管理、公用車の運行及び整備、危険物の取扱い及び機械等の維持管理、環境整備、防災及び安全管理、消防防災計画。利用者の送迎（公用車の運転等）。

■給食管理
栄養ケアマネジメント、給食運営全般、献立表の作成及び栄養管理、給食委託業者に関すること、行政機関に提出する諸調査・統計、給食費の徴収等、保健・給食会議、非常食の備蓄、厨房内の衛生管理。管理栄養士が主担当。

■法人事業方針（令和8年度）
重点目標として、人材の確保（採用・育成・定着）、働きがいのある職場づくり、人権擁護と虐待防止の徹底、より良いサービスの提供、防災対策と事故防止対策、地域との連携・交流の推進が挙げられている。国家資格（社会福祉士・精神保健福祉士・介護福祉士）の有資格者確保と、資格を持たない職員の資格取得支援にも取り組む方針。
`;

function parseSections(text) {
  const parts = text.split(/\n(?=■)/).map((s) => s.trim()).filter(Boolean);
  return parts.map((p) => {
    const lines = p.split("\n");
    const title = lines[0].replace(/^■/, "").trim();
    const body = lines.slice(1).join("\n").trim();
    return { title, body };
  });
}
const SECTIONS = parseSections(KB_TEXT);

/* ============================================================
   職員登録Q&A（この端末のブラウザに保存されます）
   検索で答えが見つからなかった内容を、答えと資料つきで
   その場で追加できるようにするための仕組み。
============================================================ */
const STORAGE_KEY = "yamaya_manual_custom_entries_v1";

function loadCustomEntries() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveCustomEntries(entries) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {
    /* 保存に失敗してもアプリは使い続けられるようにする */
  }
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function isUrl(text) {
  return /^https?:\/\/\S+$/i.test(text.trim());
}

/* ============================================================
   共有フォルダ同期（File System Access API・対応ブラウザのみ）
   Googleドライブ等の同期フォルダに置いたJSONファイルへ直接
   読み書きし、端末間で職員登録Q&Aを共有するための仕組み。
   削除は「deleted」フラグを立てて更新日時で同期させる
   （トゥームストーン方式）。
============================================================ */
const FSAPI_SUPPORTED = typeof window !== "undefined" && typeof window.showOpenFilePicker === "function";
const IDB_NAME = "yamaya_manual_db";
const IDB_STORE = "handles";
const SHARED_HANDLE_KEY = "sharedFileHandle";

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function mergeEntries(localList, incomingList) {
  const map = new Map();
  localList.forEach((e) => map.set(e.id, e));
  (incomingList || []).forEach((raw) => {
    if (!raw || !raw.id || !raw.title) return;
    const e = {
      deleted: false,
      createdAt: raw.createdAt || raw.updatedAt || Date.now(),
      updatedAt: raw.updatedAt || raw.createdAt || 0,
      ...raw,
    };
    const existing = map.get(e.id);
    if (!existing || (e.updatedAt || 0) >= (existing.updatedAt || 0)) {
      map.set(e.id, e);
    }
  });
  return Array.from(map.values()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

function highlight(text, terms) {
  if (!terms.length) return text;
  const pattern = new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  const parts = text.split(pattern);
  return parts.map((part, i) => terms.some((t) => part.toLowerCase() === t.toLowerCase())
    ? <mark key={i}>{part}</mark> : part);
}

function search(query, customEntries) {
  const terms = query.trim().split(/\s+/).filter(Boolean);
  if (terms.length === 0) return [];
  const customAsSections = customEntries.filter((e) => !e.deleted).map((e) => ({
    title: e.title, body: e.body, material: e.material, isCustom: true, id: e.id,
  }));
  const all = [...customAsSections, ...SECTIONS];
  return all.map((s) => {
    const haystack = (s.title + " " + s.body + " " + (s.material || "")).toLowerCase();
    let score = 0;
    terms.forEach((t) => {
      const tl = t.toLowerCase();
      const titleHits = (s.title.toLowerCase().split(tl).length - 1) * 3;
      const bodyHits = haystack.split(tl).length - 1;
      score += titleHits + bodyHits;
    });
    return { ...s, score };
  }).filter((s) => s.score > 0).sort((a, b) => b.score - a.score);
}

function syncStatusLabel(status, sharedHandle, lastSyncedAt) {
  if (!sharedHandle) return "共有ファイル：未接続";
  if (status === "connecting") return "共有ファイルに接続中…";
  if (status === "syncing") return "同期中…";
  if (status === "permission-needed") return "共有ファイル：" + sharedHandle.name + "（権限の確認が必要です）";
  if (status === "error") return "共有ファイル：" + sharedHandle.name + "（同期に失敗しました）";
  const timeText = lastSyncedAt
    ? lastSyncedAt.getHours().toString().padStart(2, "0") + ":" + lastSyncedAt.getMinutes().toString().padStart(2, "0")
    : "";
  return "共有ファイル：" + sharedHandle.name + (timeText ? "（" + timeText + " に同期済み）" : "");
}

        <span>{syncStatusLabel(syncStatus, sharedHandle, lastSyncedAt)}</span>

      {!fsapiSupported && (

      )}

            </React.Fragment>

          {sharedHandle && syncStatus === "permission-needed" && (

          )}

function ManualSearch() {
  const [mode, setMode] = useState("search"); // "search" | "trouble" | "register"
  const [query, setQuery] = useState("");
  const [submitted, setSubmitted] = useState("");
  const [customEntries, setCustomEntries] = useState(() => loadCustomEntries());
  const [prefillTitle, setPrefillTitle] = useState("");
  const [prefillKey, setPrefillKey] = useState(0);
  const [sharedHandle, setSharedHandle] = useState(null);
  const [syncStatus, setSyncStatus] = useState("disconnected");
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const lastSyncSignatureRef = useRef(null);

  useEffect(() => {
    saveCustomEntries(customEntries);
  }, [customEntries]);

  const runSync = async (handle, currentList) => {
    setSyncStatus("syncing");
    try {
      const perm = await handle.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") {
        setSyncStatus("permission-needed");
        return;
      }
      const file = await handle.getFile();
      const text = await file.text();
      let fileList = [];
      try {
        const parsed = JSON.parse(text || "[]");
        if (Array.isArray(parsed)) fileList = parsed;
      } catch (e) {
        fileList = [];
      }
      const merged = mergeEntries(currentList, fileList);
      const mergedSignature = JSON.stringify(merged);
      const writable = await handle.createWritable();
      await writable.write(mergedSignature);
      await writable.close();
      lastSyncSignatureRef.current = mergedSignature;
      setCustomEntries(merged);
      setSyncStatus("synced");
      setLastSyncedAt(new Date());
    } catch (e) {
      setSyncStatus("error");
    }
  };

  useEffect(() => {
    (async () => {
      try {
        const handle = await idbGet(SHARED_HANDLE_KEY);
        if (!handle) return;
        setSharedHandle(handle);
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted") {
          await runSync(handle, loadCustomEntries());
        } else {
          setSyncStatus("permission-needed");
        }
      } catch (e) {
        /* 共有ファイルの復元に失敗しても、ローカルの内容だけで使い続けられるようにする */
      }
    })();
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    if (!sharedHandle || syncStatus === "permission-needed" || syncStatus === "connecting") return;
    const signature = JSON.stringify(customEntries);
    if (signature === lastSyncSignatureRef.current) return;
    runSync(sharedHandle, customEntries);
    // eslint-disable-next-line
  }, [customEntries, sharedHandle]);

  const connectSharedFile = async (createNew) => {
    if (!FSAPI_SUPPORTED) return;
    setSyncStatus("connecting");
    try {
      let handle;
      if (createNew) {
        handle = await window.showSaveFilePicker({
          suggestedName: "manual-shared-entries.json",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(customEntries, null, 2));
        await writable.close();
      } else {
        const handles = await window.showOpenFilePicker({
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        handle = handles[0];
      }
      try {
        await idbSet(SHARED_HANDLE_KEY, handle);
      } catch (idbErr) {
        /* 次回起動時の自動復元はできなくても、今回のセッションの同期は続ける */
      }
      setSharedHandle(handle);
      await runSync(handle, customEntries);
    } catch (e) {
      setSyncStatus((s) => (s === "connecting" ? "disconnected" : s));
    }
  };

  const reconnectSharedFile = () => {
    if (sharedHandle) runSync(sharedHandle, customEntries);
  };

  const syncSharedFileNow = () => {
    if (sharedHandle) runSync(sharedHandle, customEntries);
  };

  const results = useMemo(() => search(submitted, customEntries), [submitted, customEntries]);
  const terms = submitted.trim().split(/\s+/).filter(Boolean);

  const doSearch = () => setSubmitted(query);
  const handleKeyDown = (e) => { if (e.key === "Enter") doSearch(); };

  const goToRegisterWithQuery = (q) => {
    setPrefillTitle(q);
    setPrefillKey((k) => k + 1);
    setMode("register");
  };

  const addEntry = (entry) => {
    const now = Date.now();
    setCustomEntries((prev) => [...prev, { id: makeId(), createdAt: now, updatedAt: now, deleted: false, ...entry }]);
  };
  const updateEntry = (id, updates) => {
    setCustomEntries((prev) => prev.map((e) => (e.id === id ? { ...e, ...updates, updatedAt: Date.now() } : e)));
  };
  const deleteEntry = (id) => {
    if (!window.confirm("この登録内容を削除しますか？")) return;
    setCustomEntries((prev) => prev.map((e) => (e.id === id ? { ...e, deleted: true, updatedAt: Date.now() } : e)));
  };
  const importEntries = (importedArray) => {
    setCustomEntries((prev) => mergeEntries(prev, importedArray));
  };

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        <div style={styles.header}>
          <div style={styles.badge}>やまやの里 職員向け</div>
          <h1 style={styles.h1}>マニュアル検索</h1>
          <p style={styles.subText}>キーワードでこれまで確認した係マニュアルの内容を探せます（AIは使わず、この端末だけで完結して検索します）。利用者様の個人情報は含めていません。</p>
        </div>

        <div style={styles.tabRow}>
          <button
            style={{ ...styles.tabBtn, ...(mode === "search" ? styles.tabBtnActive : {}) }}
            onClick={() => setMode("search")}
          >
            キーワードで探す
          </button>
          <button
            style={{ ...styles.tabBtn, ...(mode === "trouble" ? styles.tabBtnActive : {}) }}
            onClick={() => setMode("trouble")}
          >
            困った時は
          </button>
          <button
            style={{ ...styles.tabBtn, ...(mode === "register" ? styles.tabBtnActive : {}) }}
            onClick={() => setMode("register")}
          >
            登録する
          </button>
        </div>

        {mode === "search" && (
          <React.Fragment>
            <div style={styles.searchRow}>
              <input
                style={styles.searchInput}
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="例：医療費請求　エアコン清掃　避難訓練"
              />
              <button style={styles.searchBtn} onClick={doSearch}>検索</button>
            </div>

            <div style={styles.quickRow}>
              {["リスク管理", "医療費請求", "通院", "エアコン清掃", "リネン", "自治会", "広報", "点呼簿", "避難訓練"].map((k) => (
                <button key={k} style={styles.quickChip} onClick={() => { setQuery(k); setSubmitted(k); }}>{k}</button>
              ))}
            </div>

            <div style={styles.resultsArea}>
              {submitted === "" && (
                <p style={styles.hintText}>係名や業務名で検索してください。上のよく検索されるキーワードから選ぶこともできます。</p>
              )}
              {submitted !== "" && results.length === 0 && (
                <div style={styles.noResultBox}>
                  <p style={styles.hintText}>「{submitted}」に一致する内容は見つかりませんでした。「困った時は」タブや原本のマニュアルもあわせてご確認ください。</p>
                  <button style={styles.searchBtn} onClick={() => goToRegisterWithQuery(submitted)}>この内容を登録する</button>
                </div>
              )}
              {results.map((r, i) => (
                <ResultCard key={r.isCustom ? r.id : "kb-" + i} item={r} terms={terms} />
              ))}
            </div>
          </React.Fragment>
        )}

        {mode === "trouble" && <TroublePanel />}

        {mode === "register" && (
          <RegisterPanel
            key={prefillKey}
            customEntries={customEntries}
            onAdd={addEntry}
            onUpdate={updateEntry}
            onDelete={deleteEntry}
            onImport={importEntries}
            prefillTitle={prefillTitle}
            fsapiSupported={FSAPI_SUPPORTED}
            sharedHandle={sharedHandle}
            syncStatus={syncStatus}
            lastSyncedAt={lastSyncedAt}
            onConnect={connectSharedFile}
            onReconnect={reconnectSharedFile}
            onSyncNow={syncSharedFileNow}
          />
        )}

        <div style={styles.footNote}>
          ※ このアプリが答えられるのは、これまでの会話で確認したマニュアルと「登録する」で追加した内容の範囲内のみです。載っていない内容は検索結果に出てきません。正確な手順は、必ず原本のマニュアルもあわせてご確認ください。登録内容はこの端末に保存されます。他の職員と共有するには、「登録する」タブで共有フォルダ内のファイルに接続するか、書き出し・読み込みをご利用ください。
        </div>
      </div>
    </div>
  );
}
