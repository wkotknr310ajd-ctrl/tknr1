<script type="text/babel">
const { useState, useMemo } = React;

/* ============================================================
   マニュアル知識ベース（利用者・ご家族の個人情報は含みません）
   ■見出し で1セクション、次の■までがその内容として検索対象になります
============================================================ */
const KB_TEXT = `
■支援課全般
事業運営全般、入退所に関する書類提出、苦情受付、各種申請書・報告書、事故報告書の提出、職員研修の年間計画、介護給付費及び利用料の請求・受領、事業計画作成、ケース検討及び研究活動、支援課会議、支援課職員の業務分担、利用契約書、生活支援員の勤務表作成。

■サービス管理
サービス内容の作成・見直し、個別支援計画の適正運営、サービス調整会議・ケア会議、アセスメント及びモニタリング評価、生活支援員の支援技術の向上・指導、設置基準・サービス基準、支援経過その他の記録の整理と保管、他機関との連絡調整、受給者証及び連絡調整。

■棟運営
生活支援業務の総括、利用者の個別支援計画及び実施、男女合同会議・支援課会議・棟会議、利用者のサービス向上に関すること及び提案、利用者の外泊・外出、各担当者との連絡調整、業務マニュアルの見直し・整理・検討、居住棟内の保守点検修繕、利用者の預り金の適正管理、保護者等の連携、生活支援員の研修参加、日課の見直し・整備。日々の業務における職員からの相談対応。

■短期中期入所
短期入所に関すること、日中一時支援に関すること、請求に関すること、日誌・ケース記録の管理、個別支援計画・ケア会議等。

■医務・給食（支援課）
保健計画及び指導、治療・服薬・通院及び入退院、医務室・静養室の整理整頓、身体測定・健康診断、感染症対策、嘱託医・協力病院との連携、福祉用具の申請、保険証・診察券、医療費、給食委員会、行事食。
通院マニュアルは病院別（村上総合病院、鈴木医院、たなか皮ふ科、はまなす病院、佐々木整形外科等）と救急外来ごとに①〜⑭の手順がある。流れ：通院カレンダー確認→ポーチ・財布・配車の準備→受付〜診察〜処方箋のFAX手配→医療日誌入力→看護師へ報告。
精神科検診・相談・受診マニュアルがある（相談〜受診の流れ）。
感染症マニュアルは現場対応の資料があるが画像ベースで詳細未確認。
静養室の使い方：使用前の準備物リスト、使用後の消毒・清掃チェックリストがある。
緊急情報シート・サマリーは医務係が年1回、担当職員を割り振って更新する（例年2月末頃締切）。
治療簿・治療ポーチ・服薬チェック簿の更新は「必要なデータを開き、氏名や内容・月を変更して印刷して使用する」という運用。
医療費請求マニュアル（自己負担分）の流れ：①各病院・薬局の請求書を医療費自己負担集計表に入力→②他職員とダブルチェック→③一覧を提示し抜き取り日を記載→④金庫内の医療費ポーチから集金しチェック→⑤病院・薬局ごとに緑のクリアケースへ入れ園長へ提出→⑥支払い完了後、領収書が返却される→⑦領収書を縮小コピー（8in1）→⑧各担当職員のレターケースへ配布→⑨原本は課長へ提出。
緊急搬送付き添い後の職員の帰園方法：タクシー利用時は請求書払い（車椅子対応は事前連絡）、電車利用時は立て替えて領収書を庶務課に提出し精算。

■物品・清掃
日用品・介護用品の購入・在庫、共用物品の整備管理、リネンに関すること、清掃計画・清掃用具の管理、理美容室・洗濯室・乾燥室の管理保全、居住棟内の環境整備・保守点検修繕。
エアコン清掃：基本水曜日に2〜3名で実施。清掃箇所の月間割り振りは行事視聴覚係が勤務表を見て担当。
リネンマニュアル：外部業者「みどりの家」と契約。月・水・金の定期交換、汚れ物の仕分け・表示ルール、季節ごと（タオルケット・毛布・中掛け）の入れ替えスケジュールあり。
水野産業への発注（日用品・介護用品）：専用発注システム「EDI*WEB」にログインして商品選択〜注文確定。IDパスワードの管理場所は特定のPCに限定。
大型洗濯機の洗剤発注：業者へ電話発注（短縮ダイヤル）、月1回ペース、空容器回収の注意点あり。
理容マニュアル：2つの理容店と契約（奇数月・偶数月で交代）。予約チェック表の掲示、料金請求のタイミング、支払い時の領収書確認まで手順化。

■自治会
自治会の育成支援、活動・行事、奉仕活動、売店運営。
さくら会マニュアル：売店・ジュース代・誕生会・金銭出納帳・イオン黄色いレシート等を網羅。
入金・集金は必ずダブルチェックすること。金庫の鍵はキャップと園長による二重管理。
担当利用者ごとの金銭出納帳の記入・管理は、係業務ではなく職員一人ひとりが担当利用者について個別に行う業務。

■行事
年間行事計画の立案及び実施計画の検討・調整、行事予算及び決算の記録整備、行事の記録及び写真等の整理保管、視聴覚機器の整備保管、社会見学・昼食会・買物外出・ドライブ外出の計画実施、クラブ活動計画及び実施・調整、活動用具の管理保全、地域行事への参加、市町村社協及び関係団体との連絡調整、ボランティア等の受入れ及び活動計画。
行事視聴覚マニュアル：ボランティア受入（転倒予防体操の受け入れ調整等）、地域行事（計画案作成・備品準備の係内振り分け）、物品庫（ペン・画用紙等）や医務室リュック備品の管理を含む。

■人権
情報の収集及び関係機関との連絡調整、人権尊重・職員倫理・行動規範、身体拘束のあり方（見直し）、生活講座、日々の振り返りチェックシート、権利擁護・虐待防止委員会。
職員一人ひとりの月ごとの目標設定（面談等）、権利擁護に関する研修の企画・実施、日々の支援における問題点の汲み取り・提示。

■リスク管理
事故や安全面における情報収集及び情報提供、個別リスクマネジメントシートの作成、事故防止マニュアル、事故・ヒヤリハットの分析及び防止、事故・ヒヤリハットのKYTトレーニング、事故後の対応。
事故・ヒヤリハット・無届外出が発生した場合の流れ：問題発生→その場での対応・記録→保護者への報告→当日中にリスク検討会議を開催（当事者職員＋上司・主任・リスク管理係、最低3名）→日誌に「リスク検討会議：」と明記して記録→主任以上が報告書を作成し日誌展開→支援課会議等で再検討。
報告書のシステム入力は「福祉の森」ケース記録システムで行う。件名・概要・加害者/被害者名の扱いにルールがある。
月次のルーティン：日誌確認→毎月16日頃にヒヤリハットを前期・後期でまとめる→集計表作成→係内分析→支援課会議で報告→決裁。
事故かヒヤリハットかの判断基準が種別ごとに詳細に定められている（例：服薬ミスは5分以内なら飲み直してヒヤリハット、30分以内は看護師確認の上ヒヤリハット。転倒・熱傷・誤嚥・異食・粗暴行為・自傷・溺水・無届外出などそれぞれに基準あり）。
避難訓練は毎月実施。年間計画があり、担当は支援員2〜3名。避難訓練の年間計画立案、当日の放送・誘導・初期対応も係業務に含まれる。

■保護者会
保護者会総会・役員会に関すること、施設行事の協力に関すること、保護者会主催の行事、保護者研修。

■ホームページ・広報
広報紙の発行及び編集、広報誌関係の整理保管、保護者との連絡調整、ホームページ管理。
マンスリー作成：共有フォルダの写真データを、Excel上のマンスリー原稿に月ごとに差し替える。
ホームページ更新：管理画面にログイン→投稿追加→タイトル・画像・文章入力→公開。ID・パスワードを知っている職員は限定。
広報誌「あがきた」：法人本部と連携する年1回のフロー。本部から依頼・締切/構成の相談→表紙・行事写真の選定→レイアウトを業者に依頼→本部確認・訂正を2往復→完成品を送付。

■作業・日中活動
日中活動の計画・実施、日中活動使用棟の整理整頓、リサイクル作業、運動及び機能訓練、レクリエーション、日中活動班の連絡調整、各種イベントの出店準備、強度行動障害を有する利用者の支援計画および実施、強度行動障害についての理解。利用者の日中活動プログラムの構築、利用者の機能訓練プログラムの実施・構築。

■第三者評価
利用者アンケートの実施・活用、職員アンケートの実施・活用、利用者説明会の計画・実施、係の活動計画・活動報告の管理と補助、福祉サービス第三者評価の自己評価、福祉サービス第三者評価受審結果の検討。

■研修・育成

■相談
指定特定相談・指定一般相談・一般的な相談、障害サービス提供事業者・関係機関との連絡調整、家庭訪問・ケア会議・カンファレンス、村上・岩船地域自立支援協議会運営、障害支援区分認定調査、サービス等利用計画の作成・モニタリング、他機関との連絡調整、福祉サービスや制度についての情報提供、文書ケース記録の管理・保管。

■書類データ管理
点呼簿など定型書類の更新作業、コピー代・勤務表代の集計と徴収、年度末ファイルラベル（テプラ）の一括作成、担当引き継ぎ書の取りまとめ。
コピー代マニュアル：Excel上の金額表・領収書シートへ入力し、20日締めで徴収したお金を管理担当者へ引き渡す。
ファイル作成マニュアル：テプラで年度更新用ラベルを作成。専用データ原本を印刷して確認→専用PC限定のテプラ本体で印刷。
点呼簿マニュアル：避難訓練・乗り物利用時の点呼簿を、変更シートで更新→各シートに反映確認→印刷。
担当引き継ぎ書マニュアル：1月中旬に周知→3月15日締切→提出物チェック（受給者証と照合）→入所主任・サビ管への回覧→決裁→ファイル保管・周知、という年間サイクル。
勤務表マニュアルは、雇用形態が絡むため書類データ管理係だけでは作成できないとされている（支援課全般側の管理業務）。

■庶務課全般
服務及び研修、予算の企画調整、物品の取得管理及び処分、指導監査等の資料作成、個人情報に関すること、各種調査、職員の福利厚生・健康診断、後援会、保護者会費、行政からの通知に関すること。

■経理・管理
予算の執行事務、経理及び決算、給与及び旅費、社会保険及び労働保険、支援費及び利用料の収納、寄付金・寄付物品等の管理、利用者の預り金（預金払戻等）、小口現金の出納事務。

■施設管理
文書等の収受発送及び整理保管、施設の維持管理及び保全、燃料の管理、公用車の運行及び整備、危険物の取扱い及び機械等の維持管理、環境整備、防災及び安全管理、消防防災計画。利用者の送迎（公用車の運転等）。

■給食管理
栄養ケアマネジメント、給食運営全般、献立表の作成及び栄養管理、給食委託業者に関すること、行政機関に提出する諸調査・統計、給食費の徴収等、保健・給食会議、非常食の備蓄、厨房内の衛生管理。管理栄養士が主担当。

■法人事業方針（令和8年度）
重点目標として、人材の確保（採用・育成・定着）、働きがいのある職場づくり、人権擁護と虐待防止の徹底、より良いサービスの提供、防災対策と事故防止対策、地域との連携・交流の推進が挙げられている。国家資格（社会福祉士・精神保健福祉士・介護福祉士）の有資格者確保と、資格を持たない職員の資格取得支援にも取り組む方針。
`;

function parseSections(text) {
  const parts = text.split(/\n(?=■)/).map((s) => s.trim()).filter(Boolean);
  return parts.map((p) => {
    const lines = p.split("\n");
    const title = lines[0].replace(/^■/, "").trim();
    const body = lines.slice(1).join("\n").trim();
    return { title, body };
  });
}
const SECTIONS = parseSections(KB_TEXT);

function highlight(text, terms) {
  if (!terms.length) return text;
  const pattern = new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  const parts = text.split(pattern);
  return parts.map((part, i) => terms.some((t) => part.toLowerCase() === t.toLowerCase())
    ? <mark key={i}>{part}</mark> : part);
}

function search(query) {
  const terms = query.trim().split(/\s+/).filter(Boolean);
  if (terms.length === 0) return [];
  return SECTIONS.map((s) => {
    const haystack = (s.title + " " + s.body).toLowerCase();
    let score = 0;
    terms.forEach((t) => {
      const tl = t.toLowerCase();
      const titleHits = (s.title.toLowerCase().split(tl).length - 1) * 3;
      const bodyHits = haystack.split(tl).length - 1;
      score += titleHits + bodyHits;
    });
    return { ...s, score };
  }).filter((s) => s.score > 0).sort((a, b) => b.score - a.score);
}

function ManualSearch() {
  const [query, setQuery] = useState("");
  const [submitted, setSubmitted] = useState("");
  const results = useMemo(() => search(submitted), [submitted]);
  const terms = submitted.trim().split(/\s+/).filter(Boolean);

  const doSearch = () => setSubmitted(query);
  const handleKeyDown = (e) => { if (e.key === "Enter") doSearch(); };

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        <div style={styles.header}>
          <div style={styles.badge}>やまやの里 職員向け</div>
          <h1 style={styles.h1}>マニュアル検索</h1>
          <p style={styles.subText}>キーワードでこれまで確認した係マニュアルの内容を探せます（AIは使わず、この端末だけで完結して検索します）。利用者様の個人情報は含めていません。</p>
        </div>

        <div style={styles.searchRow}>
          <input
            style={styles.searchInput}
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="例：医療費請求　エアコン清掃　避難訓練"
          />
          <button style={styles.searchBtn} onClick={doSearch}>検索</button>
        </div>

        <div style={styles.quickRow}>
          {["リスク管理", "医療費請求", "通院", "エアコン清掃", "リネン", "自治会", "広報", "点呼簿", "避難訓練"].map((k) => (
            <button key={k} style={styles.quickChip} onClick={() => { setQuery(k); setSubmitted(k); }}>{k}</button>
          ))}
        </div>

        <div style={styles.resultsArea}>
          {submitted === "" && (
            <p style={styles.hintText}>係名や業務名で検索してください。上のよく検索されるキーワードから選ぶこともできます。</p>
          )}
          {submitted !== "" && results.length === 0 && (
            <p style={styles.hintText}>「{submitted}」に一致する内容は見つかりませんでした。まだこのアプリに読み込まれていないマニュアルの可能性があります。</p>
          )}
          {results.map((r, i) => (
            <div key={i} style={styles.resultCard} className="fade">
              <div style={styles.resultTitle}>{highlight(r.title, terms)}</div>
              <div style={styles.resultBody}>{highlight(r.body, terms)}</div>
            </div>
          ))}
        </div>

        <div style={styles.footNote}>
          ※ このアプリが答えられるのは、これまでの会話で確認したマニュアルの範囲内のみです。載っていない内容は検索結果に出てきません。正確な手順は、必ず原本のマニュアルもあわせてご確認ください。
        </div>
      </div>
    </div>
  );
}

const serif = "'Shippori Mincho B1', serif";
const sans = "'Zen Kaku Gothic New', sans-serif";

  container: { width: "100%", maxWidth: 680, display: "flex", flexDirection: "column" },

  badge: { display: "inline-block", fontSize: 12, letterSpacing: "0.1em", color: "#5E7350", background: "#DDE6CE", padding: "5px 14px", borderRadius: 999, marginBottom: 12, border: "1px solid #C3D2AE" },
