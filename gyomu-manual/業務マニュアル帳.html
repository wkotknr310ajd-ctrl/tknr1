<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務マニュアル帳</title>
<style>
  :root {
    --bg: #f2f6f4;
    --panel: #ffffff;
    --text: #1f2d2a;
    --muted: #61736e;
    --line: #dde6e2;
    --accent: #13806a;
    --accent-dark: #0e6655;
    --accent-soft: #e2f3ee;
    --ok: #1a7f43;
    --ok-soft: #e3f5e9;
    --warn: #a95c08;
    --warn-soft: #fff3df;
    --ng: #b42318;
    --ng-soft: #fdeceb;
    --plan-soft: #edf2f0;
    --shadow: 0 1px 2px rgba(20, 50, 42, .06), 0 6px 20px rgba(20, 50, 42, .06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  header {
    background: linear-gradient(120deg, #0e6655 0%, #13806a 55%, #2a9d84 100%);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 21px; margin: 0; white-space: nowrap; letter-spacing: .04em; }
  header .role { color: #e3f4ef; font-size: 14px; }
  header .role select { font-weight: bold; font-size: 16px; padding: 4px 10px; border-radius: 999px; border: none; color: var(--accent-dark); }
  header .save-status { margin-left: auto; font-size: 12px; color: #d4eee7; }
  nav {
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 20px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  nav button {
    border: none;
    background: none;
    padding: 8px 16px;
    font: inherit;
    font-size: 15px;
    cursor: pointer;
    color: var(--muted);
    border-radius: 999px;
    transition: background .15s, color .15s;
  }
  nav button:hover { background: var(--plan-soft); color: var(--text); }
  nav button.active { color: #fff; background: var(--accent); font-weight: bold; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  h3 { font-size: 17px; margin: 0 0 10px; color: var(--accent-dark); }
  .panel {
    background: var(--panel);
    border: 1px solid rgba(0, 0, 0, .02);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar .spacer { flex: 1; }
  button.btn, a.btn, label.btn {
    display: inline-block;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  button.btn:hover, label.btn:hover { background: var(--plan-soft); border-color: #c9d6d1; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff !important; font-weight: bold; }
  .btn.primary:hover { background: var(--accent-dark) !important; border-color: var(--accent-dark); }
  button.danger { color: var(--ng); border-color: #f2c4c4; }
  button.danger:hover { background: var(--ng-soft); }
  button.small { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea {
    font: inherit;
    padding: 7px 10px;
    border: 1px solid #c8d4cf;
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 0 8px;
    border-radius: 10px;
    background: var(--plan-soft);
    color: #44515f;
    margin-right: 4px;
    white-space: nowrap;
  }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.ng { background: var(--ng-soft); color: var(--ng); }
  .tag.cat { background: var(--accent-soft); color: var(--accent); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  ul.items li:last-child { border-bottom: none; }
  ul.items .body { flex: 1; min-width: 0; }
  ul.items .title { font-weight: bold; }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: none; font: inherit; padding: 0; }
  .pre { white-space: pre-wrap; word-break: break-word; }

  /* 年間予定表 */
  .year-table-wrap { overflow-x: auto; }
  table.year { border-collapse: collapse; width: 100%; min-width: 900px; background: #fff; }
  table.year th, table.year td { border: 1px solid var(--line); padding: 4px; font-size: 13px; vertical-align: top; }
  table.year thead th { background: #f0f3f7; position: sticky; top: 0; }
  table.year th.task { text-align: left; min-width: 200px; max-width: 260px; }
  table.year td.cell { text-align: center; cursor: pointer; width: 6.5%; height: 34px; }
  table.year td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.year td.plan { background: var(--plan-soft); }
  table.year td.done { background: var(--ok-soft); color: var(--ok); font-weight: bold; }
  table.year td.late { background: var(--ng-soft); color: var(--ng); }
  table.year td.extra { background: #f3f0ff; color: #6d28d9; }
  table.year td.now { box-shadow: inset 0 0 0 2px var(--warn); }
  table.year tr.cat-row th { background: #fafbfc; text-align: left; color: var(--accent); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); margin-right: 4px; vertical-align: -1px; }
  .legend .l-plan::before { background: var(--plan-soft); }
  .legend .l-done::before { background: var(--ok-soft); }
  .legend .l-late::before { background: var(--ng-soft); }
  .legend .l-extra::before { background: #f3f0ff; }

  /* マニュアル */
  .manual-task { page-break-inside: avoid; }
  .manual-task h3 { font-size: 18px; border-left: 5px solid var(--accent); padding-left: 8px; margin-bottom: 12px; }
  .manual-task h4 { margin: 14px 0 4px; font-size: 15px; color: #334155; }
  table.kv { border-collapse: collapse; width: 100%; }
  table.kv th, table.kv td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; font-size: 14px; vertical-align: top; }
  table.kv th { background: #f6f8fa; width: 180px; font-weight: normal; color: #44515f; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 48px; }
  .bars div { flex: 1; background: var(--accent); opacity: .75; min-height: 1px; border-radius: 2px 2px 0 0; }
  .bars-label { display: flex; gap: 2px; font-size: 11px; color: var(--muted); }
  .bars-label span { flex: 1; text-align: center; }
  .history-item { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 6px 0; }

  /* ダイアログ */
  dialog { border: none; border-radius: 16px; padding: 0; width: min(720px, 96vw); max-height: 92vh; }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog form { padding: 20px; }
  dialog h2 { margin-bottom: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row > label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .form-row .hint { font-size: 12px; color: var(--muted); font-weight: normal; }
  .form-row input[type=text], .form-row input[type=number], .form-row select { width: 100%; }
  .form-inline { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-inline > div { flex: 1; min-width: 140px; }
  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .months label { border: 1px solid var(--line); border-radius: 6px; padding: 4px; text-align: center; cursor: pointer; font-weight: normal; }
  .months input { margin-right: 4px; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dialog-actions .left { margin-right: auto; }
  .banner { background: var(--warn-soft); border: 1px solid #f5d08a; color: #7c4a03; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner.remind { background: #fff7d6; border-color: #f2c94c; font-weight: bold; font-size: 16px; }
  .stat { display: inline-block; margin-right: 18px; }
  .stat b { font-size: 20px; }

  dialog.wide { width: min(1100px, 98vw); }
  table.import { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.import th, table.import td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.import th { background: #f0f3f7; position: sticky; top: 0; white-space: nowrap; z-index: 1; }
  table.import tr.off { opacity: .45; }
  .nowrap { white-space: nowrap; }

  .help p { margin: 4px 0 8px; }
  .help ul { margin: 4px 0 8px; padding-left: 1.4em; }
  .help-step { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .help-step:first-of-type { border-top: none; }
  .help-step h3 { margin: 2px 0 4px; color: var(--text); }
  .help-no { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
    font-weight: bold; display: flex; align-items: center; justify-content: center; }

  @media print {
    header, nav, .toolbar, .no-print, .banner { display: none !important; }
    body { background: #fff; font-size: 12px; }
    main { padding: 0; max-width: none; }
    .panel { border: none; padding: 0; margin-bottom: 24px; }
    .manual-task { page-break-before: always; }
    .manual-task:first-of-type { page-break-before: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>🌿 業務マニュアル帳</h1>
  <span class="role" id="roleLabel"></span>
  <span class="save-status" id="saveStatus"></span>
</header>
<nav id="nav">
  <button data-view="home">🏠 ホーム</button>
  <button data-view="year">📅 年間予定表</button>
  <button data-view="journal">✏️ 業務日誌</button>
  <button data-view="tasks">📋 業務一覧</button>
  <button data-view="manual">📘 マニュアル</button>
  <button data-view="help">❓ 使い方</button>
  <button data-view="data">⚙️ 設定・データ</button>
</nav>
<main id="main"></main>

<dialog id="taskDialog">
  <form method="dialog" id="taskForm">
    <h2 id="taskDialogTitle">業務を登録</h2>
    <input type="hidden" name="id">
    <div class="form-inline">
      <div class="form-row" style="flex:2">
        <label>業務名 <span class="hint">（必須）</span></label>
        <input type="text" name="title" required placeholder="例: 予算要求書の作成">
      </div>
      <div class="form-row">
        <label>分類</label>
        <input type="text" name="category" list="categoryList" placeholder="例: 予算・会計">
      </div>
    </div>
    <div class="form-row">
      <label>実施する月 <span class="hint">（定例でない・随時の業務は何も選ばない）</span></label>
      <div class="toolbar" style="margin-bottom:6px">
        <button type="button" class="btn small" data-months="all">毎月</button>
        <button type="button" class="btn small" data-months="quarter">四半期（4・7・10・1月）</button>
        <button type="button" class="btn small" data-months="none">クリア</button>
      </div>
      <div class="months" id="monthChecks"></div>
    </div>
    <div class="form-inline">
      <div class="form-row">
        <label>期限・実施日 <span class="hint">（日）</span></label>
        <input type="number" name="day" min="1" max="31" placeholder="例: 10（空欄=月内）">
      </div>
      <div class="form-row">
        <label>周期</label>
        <select name="everyN">
          <option value="1">毎年</option>
          <option value="2">2年に1回</option>
          <option value="3">3年に1回</option>
          <option value="4">4年に1回</option>
          <option value="5">5年に1回</option>
          <option value="6">6年に1回</option>
          <option value="10">10年に1回</option>
        </select>
      </div>
      <div class="form-row">
        <label>基準年度 <span class="hint">（数年ごとの場合）</span></label>
        <input type="number" name="baseYear" min="1990" max="2100">
      </div>
    </div>
    <div class="form-inline">
      <div class="form-row">
        <label>準備開始 <span class="hint">（期限の何日前から）</span></label>
        <input type="number" name="leadDays" min="0" placeholder="例: 30">
      </div>
      <div class="form-row">
        <label>想定所要日数</label>
        <input type="number" name="durationDays" min="0" placeholder="例: 5">
      </div>
      <div class="form-row">
        <label>想定作業時間 <span class="hint">（時間）</span></label>
        <input type="number" name="hours" min="0" step="0.5" placeholder="例: 8">
      </div>
    </div>
    <div class="form-row">
      <label>目的・概要</label>
      <textarea name="purpose" placeholder="何のための業務か、誰に何を提出するか など"></textarea>
    </div>
    <div class="form-row">
      <label>手順 <span class="hint">（1行に1手順で書くと番号付きで表示されます）</span></label>
      <textarea name="steps" style="min-height:120px" placeholder="例:&#10;前年度の資料をフォルダから探す&#10;担当課に照会文を送る&#10;集計して課長決裁"></textarea>
    </div>
    <div class="form-row">
      <label>注意点・コツ</label>
      <textarea name="tips"></textarea>
    </div>
    <div class="form-row">
      <label>関係先・資料の保存場所</label>
      <textarea name="related" placeholder="例: 提出先＝財政課 / 様式＝共有フォルダ\予算\R8"></textarea>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="archived"> 現在は行っていない業務（廃止）</label>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn danger left" id="taskDelete">削除</button>
      <button type="button" class="btn" data-close>キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="recordDialog">
  <form method="dialog" id="recordForm">
    <h2 id="recordDialogTitle">実施記録を入力</h2>
    <input type="hidden" name="id">
    <div class="form-row">
      <label>業務</label>
      <select name="taskId" id="recordTaskSelect"></select>
    </div>
    <div class="form-row" id="recordTitleRow">
      <label>件名 <span class="hint">（業務一覧にない場合。あとから業務に登録できます）</span></label>
      <input type="text" name="title" placeholder="例: 〇〇から急な照会があり回答">
    </div>
    <div class="form-inline">
      <div class="form-row">
        <label>実施日（開始日）</label>
        <input type="date" name="date" required>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px" id="dayButtons"></div>
      </div>
      <div class="form-row">
        <label>終了日 <span class="hint">（数日かかった場合）</span></label>
        <input type="date" name="endDate">
      </div>
      <div class="form-row">
        <label>作業時間 <span class="hint">（時間）</span></label>
        <input type="number" name="hours" min="0" step="0.25">
      </div>
      <div class="form-row" id="recordOccRow">
        <label>対象の回 <span class="hint">（予定の年月）</span></label>
        <input type="month" name="occ">
      </div>
    </div>
    <div class="form-row">
      <label>やったこと</label>
      <textarea name="content" style="min-height:110px" placeholder="実際に行った作業、使った資料、連絡した相手 など"></textarea>
    </div>
    <div class="form-row">
      <label>気づき・次回への申し送り</label>
      <textarea name="notes" placeholder="つまずいた点、もっと早く始めるべきだった点、次の担当者へのメモ"></textarea>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="partial"> まだ途中（完了していない）</label>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn danger left" id="recordDelete">削除</button>
      <button type="button" class="btn" data-close>キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="importDialog" class="wide">
  <form method="dialog" id="importForm">
    <h2>Excel・Word から取り込み</h2>
    <p class="muted">「<span id="importFileName"></span>」から読み取った候補です。取り込むものにチェックを入れ、種類・名前・役職を確認してください。
      <br>「業務（年間予定）」は毎年その月の予定として、「実施記録」はその日に行った記録として登録されます（今日より前の日付は実施記録になっています）。</p>
    <div class="toolbar">
      <button type="button" class="btn small" data-imp="all">すべて選択</button>
      <button type="button" class="btn small" data-imp="none">すべて解除</button>
      <button type="button" class="btn small" data-imp="task">すべて業務に</button>
      <button type="button" class="btn small" data-imp="record">日付のあるものはすべて実施記録に</button>
      <span class="spacer"></span><span class="muted" id="importCount"></span>
    </div>
    <div class="toolbar" id="importFilters"></div>
    <div style="max-height:55vh;overflow:auto">
      <table class="import"><thead><tr><th></th><th>種類</th><th>日付・時期</th><th>名前（業務名・件名）</th><th>役職</th><th>担当者など</th><th>読み取り元</th></tr></thead>
      <tbody id="importRows"></tbody></table>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close>キャンセル</button>
      <button type="button" class="btn primary" id="importApply">選んだものを登録</button>
    </div>
  </form>
</dialog>

<datalist id="categoryList"></datalist>

<!-- 配布用: 「データ入りのアプリを作る」で、ここに初期データが入る -->
<script id="embeddedData" type="application/json">null</script>
<script>
"use strict";

// 画面を描く前のこのファイルの中身（データ入りのアプリを作るときに使う）
const PRISTINE_HTML = "<!doctype html>\n" + document.documentElement.outerHTML;

/* ===================== データ ===================== */

const STORAGE_KEY = "gyomu-manual-v1";
const MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function emptyData() {
  return {
    version: 1,
    settings: { roles: ["園長", "課長", "入所サビ管", "そよかぜ", "Aさん", "Bさん", "Cさん", "Dさん"], rolesAdded: ["そよかぜ", "Aさん", "Bさん", "Cさん", "Dさん"], roleMembers: { "園長": "工藤", "課長": "鈴木", "入所サビ管": "木村 忍", "そよかぜ": "佐藤 恭成" }, currentRole: "園長", org: "", fyStart: 4, remindEnabled: true, remindTime: "16:00", remindWeekdaysOnly: true },
    tasks: [],
    records: [],
    imports: [],
    updatedAt: null
  };
}

let data = loadLocal();
let fileHandle = null;      // 連携中のデータファイル
let filePermission = false; // 書き込み許可済みか
let saveTimer = null;

const ui = {
  view: "home",
  fy: null,
  journalMonth: "",
  journalTask: "",
  journalQuery: "",
  manualTask: "",
  taskQuery: "",
  sel: new Set(),    // 選択中の記録
  selT: new Set(),   // 選択中の業務
  undo: null         // 直前に削除したもの（元に戻す用）
};

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { console.error(e); }
  // このパソコンでまだ使っていなければ、アプリに入っている初期データから始める
  const embedded = embeddedData();
  if (embedded) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(embedded)); } catch (e) { console.error(e); }
    return embedded;
  }
  return emptyData();
}
function embeddedData() {
  try {
    const d = JSON.parse(document.getElementById("embeddedData").textContent);
    return d ? normalize(d) : null;
  } catch (e) { console.error(e); return null; }
}

/** いまのデータを初期データとして入れた、このアプリのコピーを作る */
function exportAppWithData() {
  const copy = JSON.parse(JSON.stringify(data));
  delete copy._fileSavedAt;
  copy.embeddedAt = new Date().toISOString();
  const json = JSON.stringify(copy).replace(/</g, "\\u003c");
  const html = PRISTINE_HTML.replace(/<script id="embeddedData" type="application\/json">[\s\S]*?<\/script>/,
    () => `<script id="embeddedData" type="application/json">${json}<\/script>`);
  downloadBlob(`業務マニュアル帳（データ入り_${todayYmd()}）.html`, new Blob([html], { type: "text/html" }));
}

function normalize(d) {
  const base = emptyData();
  const out = Object.assign(base, d || {});
  out.settings = Object.assign(emptyData().settings, (d && d.settings) || {});
  out.tasks = Array.isArray(out.tasks) ? out.tasks : [];
  out.records = Array.isArray(out.records) ? out.records : [];
  out.imports = Array.isArray(out.imports) ? out.imports : [];
  // 役職ごとに業務と記録を分ける（旧データは「役職」欄の値か先頭の役職に入れる）
  const st = out.settings;
  if (!Array.isArray(st.roles) || !st.roles.length) st.roles = emptyData().settings.roles;
  if (st.role && !st.roles.includes(st.role)) st.roles.push(st.role);
  // あとから既定の選択肢に加えた役職を、以前のデータにも 1 度だけ追加する
  // 予定表の担当者名と役職の対応（以前のデータには既定の対応を入れる）
  if (!st.roleMembers || typeof st.roleMembers !== "object") st.roleMembers = {};
  if (!(d && d.settings && d.settings.roleMembers)) {
    Object.entries(emptyData().settings.roleMembers).forEach(([r, n]) => { if (st.roles.includes(r) || r === "そよかぜ") st.roleMembers[r] = st.roleMembers[r] || n; });
  }
  st.rolesAdded = d && d.settings ? (Array.isArray(d.settings.rolesAdded) ? [...d.settings.rolesAdded] : []) : st.rolesAdded;
  ["そよかぜ", "Aさん", "Bさん", "Cさん", "Dさん"].forEach(r => { if (!st.rolesAdded.includes(r)) { if (!st.roles.includes(r)) st.roles.push(r); st.rolesAdded.push(r); } });
  const fallbackRole = st.role || st.currentRole || st.roles[0];
  delete st.role;
  if (!st.roles.includes(st.currentRole)) st.currentRole = st.roles[0];
  [...out.tasks, ...out.records].forEach(x => {
    if (!x.role) x.role = fallbackRole;
    if (!st.roles.includes(x.role)) st.roles.push(x.role);
  });
  out.tasks.forEach(t => {
    t.months = Array.isArray(t.months) ? t.months.map(Number) : [];
    t.everyN = Number(t.everyN) || 1;
  });
  return out;
}

function save() {
  data.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    alert("ブラウザへの保存に失敗しました。「設定・データ」からファイルに書き出してください。\n" + e);
  }
  if (fileHandle && filePermission) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 400);
  }
  updateSaveStatus();
}

async function writeFile() {
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
    data._fileSavedAt = new Date().toISOString();
    updateSaveStatus("ファイルに保存しました");
  } catch (e) {
    console.error(e);
    filePermission = false;
    updateSaveStatus("ファイルへの保存に失敗しました");
    render();
  }
}

function updateSaveStatus(msg) {
  const el = document.getElementById("saveStatus");
  const parts = [];
  if (fileHandle) parts.push(filePermission ? "📄 " + fileHandle.name + " と連携中" : "📄 " + fileHandle.name + "（再接続が必要）");
  else parts.push("ブラウザ内に保存");
  if (data.updatedAt) parts.push("最終更新 " + fmtDateTime(data.updatedAt));
  if (msg) parts.push(msg);
  el.textContent = parts.join("　");
}

/* ----- ファイル連携（Edge / Chrome の File System Access API） ----- */

const fsSupported = "showSaveFilePicker" in window;

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("gyomu-manual", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const req = db.transaction("kv").objectStore("kv").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    if (value === undefined) tx.objectStore("kv").delete(key); else tx.objectStore("kv").put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function restoreFileHandle() {
  if (!fsSupported) return;
  try {
    const h = await idbGet("fileHandle");
    if (!h) return;
    fileHandle = h;
    filePermission = (await h.queryPermission({ mode: "readwrite" })) === "granted";
    if (filePermission) await loadFromHandle();
  } catch (e) { console.error(e); }
}

async function reconnectFile() {
  if (!fileHandle) return;
  const p = await fileHandle.requestPermission({ mode: "readwrite" });
  filePermission = p === "granted";
  if (filePermission) await loadFromHandle();
  render();
}

async function loadFromHandle() {
  const file = await fileHandle.getFile();
  const text = await file.text();
  if (!text.trim()) { await writeFile(); return; }
  const fromFile = normalize(JSON.parse(text));
  // ファイルとブラウザ内のうち新しい方を採用する
  if (!data.updatedAt || (fromFile.updatedAt && fromFile.updatedAt >= data.updatedAt)) {
    data = fromFile;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } else {
    await writeFile();
  }
}

async function createDataFile() {
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: "業務マニュアルデータ.json",
      types: [{ description: "業務マニュアル帳データ", accept: { "application/json": [".json"] } }]
    });
    fileHandle = h;
    filePermission = true;
    await idbSet("fileHandle", h);
    await writeFile();
    render();
  } catch (e) { if (e.name !== "AbortError") alert(e); }
}

async function openDataFile() {
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description: "業務マニュアル帳データ", accept: { "application/json": [".json"] } }]
    });
    const text = await (await h.getFile()).text();
    const fromFile = normalize(JSON.parse(text));
    if ((data.tasks.length || data.records.length) &&
        !confirm("このファイルの内容で、いまブラウザにあるデータを置き換えます。よろしいですか？")) return;
    fileHandle = h;
    const p = await h.requestPermission({ mode: "readwrite" });
    filePermission = p === "granted";
    data = fromFile;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    await idbSet("fileHandle", h);
    render();
  } catch (e) { if (e.name !== "AbortError") alert("読み込めませんでした: " + e.message); }
}

async function unlinkFile() {
  fileHandle = null;
  filePermission = false;
  await idbSet("fileHandle", undefined);
  render();
}

/* ===================== ユーティリティ ===================== */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function toYmd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); }
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayYmd() { return toYmd(today()); }
function thisMonthKey() { return todayYmd().slice(0, 7); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(s) {
  if (!s) return "";
  const d = parseYmd(s);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
}
function fmtMonthKey(k) { const [y, m] = k.split("-").map(Number); return `${y}年${m}月`; }
function fmtDateTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function round1(n) { return Math.round(n * 10) / 10; }
function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }

function fyStart() { return Number(data.settings.fyStart) || 4; }
/** 日付から年度を求める */
function fyOf(date) { const y = date.getFullYear(), m = date.getMonth() + 1; return m >= fyStart() ? y : y - 1; }
/** 年度内の月順（4,5,...,12,1,2,3 など） */
function fyMonths() { const s = fyStart(); return Array.from({ length: 12 }, (_, i) => ((s - 1 + i) % 12) + 1); }
function calYear(fy, month) { return month >= fyStart() ? fy : fy + 1; }
function fyLabel(fy) { return fyStart() === 1 ? `${fy}年` : `${fy}年度`; }

function taskById(id) { return data.tasks.find(t => t.id === id); }
function curRole() { return data.settings.currentRole; }
function myTasks() { return data.tasks.filter(t => t.role === curRole()); }
function myRecords() { return data.records.filter(r => r.role === curRole()); }
function recordTitle(r) { const t = taskById(r.taskId); return t ? t.title : (r.title || "（件名なし）"); }

function scheduleText(t) {
  if (!t.months.length) return "随時・不定期";
  let s;
  const ms = [...t.months].sort((a, b) => fyMonths().indexOf(a) - fyMonths().indexOf(b));
  if (ms.length === 12) s = "毎月";
  else s = ms.map(m => m + "月").join("・");
  if (t.day) s += ` ${t.day}日`;
  if (t.everyN > 1) s = `${t.everyN}年に1回（${fyLabel(Number(t.baseYear) || "")}〜） ` + s;
  else if (ms.length < 12) s = "毎年 " + s;
  return s;
}

/** 指定年度にその業務が行われる回（予定）の一覧 */
function occurrencesInFy(t, fy) {
  if (t.archived || !t.months.length) return [];
  const n = t.everyN || 1;
  const base = Number(t.baseYear) || fy;
  if (((fy - base) % n + n) % n !== 0) return [];
  return t.months.map(m => {
    const y = calYear(fy, m);
    const key = `${y}-${pad(m)}`;
    let due = null;
    if (t.day) {
      const last = new Date(y, m, 0).getDate();
      due = new Date(y, m - 1, Math.min(Number(t.day), last));
    }
    return { task: t, key, y, m, due };
  });
}

function recordsForOcc(task, key) {
  return myRecords().filter(r => r.taskId === task.id && (r.occ || r.date.slice(0, 7)) === key);
}
function occStatus(occ) {
  const recs = recordsForOcc(occ.task, occ.key);
  if (recs.length && recs.some(r => !r.partial)) return "done";
  if (recs.length) return "partial";
  return occ.key < thisMonthKey() ? "late" : "plan";
}

/* ===================== 実績の集計（マニュアル用） ===================== */

function taskStats(t) {
  const recs = myRecords().filter(r => r.taskId === t.id).sort((a, b) => a.date.localeCompare(b.date));
  const groups = {};
  recs.forEach(r => { const k = r.occ || r.date.slice(0, 7); (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups).sort();
  const durations = [], hours = [], leadBefore = [];
  const monthCount = Array(13).fill(0);
  keys.forEach(k => {
    const g = groups[k];
    const start = g.reduce((min, r) => r.date < min ? r.date : min, g[0].date);
    const end = g.reduce((max, r) => { const e = r.endDate || r.date; return e > max ? e : max; }, g[0].endDate || g[0].date);
    durations.push(daysBetween(parseYmd(start), parseYmd(end)) + 1);
    const h = g.reduce((s, r) => s + (Number(r.hours) || 0), 0);
    if (h > 0) hours.push(h);
    monthCount[parseYmd(start).getMonth() + 1]++;
    if (t.day) {
      const [y, m] = k.split("-").map(Number);
      const last = new Date(y, m, 0).getDate();
      const due = new Date(y, m - 1, Math.min(Number(t.day), last));
      leadBefore.push(daysBetween(parseYmd(start), due));
    }
  });
  const years = [...new Set(recs.map(r => fyOf(parseYmd(r.date))))].sort();
  return {
    recs, groups, keys, years,
    count: keys.length,
    avgDuration: avg(durations), minDuration: durations.length ? Math.min(...durations) : null, maxDuration: durations.length ? Math.max(...durations) : null,
    avgHours: avg(hours),
    avgLead: avg(leadBefore),
    monthCount,
    first: recs[0] ? recs[0].date : null,
    last: recs.length ? recs[recs.length - 1].date : null
  };
}

/* ----- ホーム ----- */
function viewHome() {
  const t0 = today();
  const curKey = thisMonthKey();
  const fy = fyOf(t0);
  const occs = myTasks().flatMap(t => [...occurrencesInFy(t, fy), ...occurrencesInFy(t, fy + 1)]);

  const thisMonth = occs.filter(o => o.key === curKey);
  const prep = occs.filter(o => {
    if (o.key <= curKey) return false;
    if (occStatus(o) === "done") return false;
    const lead = Number(o.task.leadDays) || 0;
    const dueish = o.due || new Date(o.y, o.m - 1, 1);
    return addDays(dueish, -lead) <= t0;
  });
  const next = occs.filter(o => {
    const [y, m] = curKey.split("-").map(Number);
    const nk = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
    return o.key === nk && !prep.includes(o);
  });
  const late = occs.filter(o => o.key < curKey && fyOf(new Date(o.y, o.m - 1, 1)) === fy && occStatus(o) === "late");
  const recent = [...myRecords()].sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || ""))).slice(0, 8);

  const occItem = o => {
    const st = occStatus(o);
    const tag = { done: '<span class="tag ok">実施済</span>', partial: '<span class="tag warn">途中</span>', late: '<span class="tag ng">未実施</span>', plan: '<span class="tag">予定</span>' }[st];
    const dueTxt = o.due ? `期限 ${fmtDate(toYmd(o.due))}` : fmtMonthKey(o.key);
    const stats = taskStats(o.task);
    const hint = [];
    if (o.task.leadDays) hint.push(`期限の${o.task.leadDays}日前から準備`);
    if (stats.avgDuration) hint.push(`実績: 平均${round1(stats.avgDuration)}日`);
    if (stats.avgHours) hint.push(`約${round1(stats.avgHours)}時間`);
    return `<li><div class="body">
        <div>${tag}<button class="link title" data-action="openManual" data-id="${o.task.id}">${esc(o.task.title)}</button></div>
        <div class="muted">${dueTxt}${hint.length ? "　/　" + hint.join("・") : ""}</div>
      </div>
      <button class="btn small" data-action="addRecord" data-task="${o.task.id}" data-occ="${o.key}">実施を記録</button></li>`;
  };
  const list = (arr, empty) => arr.length ? `<ul class="items">${arr.map(occItem).join("")}</ul>` : `<div class="empty">${empty}</div>`;

  if (!myTasks().length && !myRecords().length) {
    return `<div class="panel">
      <h2>はじめに</h2>
      <p>このアプリは、役職の<b>年間の業務予定</b>と<b>日々の実施記録</b>をためていき、数年後には
      そのまま<b>業務マニュアル</b>になることを目指した帳簿です。</p>
      <ol>
        <li>画面上部で役職（園長・課長・入所サビ管など）を選びます。「設定・データ」で役職の追加・名前の変更、年度の始まり月の設定、<b>データファイルとの連携</b>（推奨）ができます。</li>
        <li>行事予定表などの Excel・Word があれば「Excel・Wordから取り込み」で読み込めます。</li>
        <li>「業務一覧」に、毎月・毎年・数年に1回の業務など、分かっている業務を登録します。</li>
        <li>業務をしたら「実施を記録」から、やったこと・かかった日数や時間・気づきを入れます。
            予定にない業務も「業務日誌」に日記のように書いておけば、あとから業務として登録できます。</li>
        <li>「年間予定表」で1年の流れを、「マニュアル」で業務ごとの手順と過去の実績（目安の時期・期間）を確認できます。</li>
      </ol>
      <div class="toolbar">
        <button class="btn primary" data-action="addTask">業務を登録する</button>
        <button class="btn" data-action="addRecord">今日の業務を記録する</button>
        <button class="btn" data-action="loadSample">サンプルデータを入れて試す</button>
        <label class="btn">Excel・Wordから取り込み<input type="file" accept=".xlsx,.xlsm,.docx" class="importOffice" hidden></label>
      </div>

  }

  return `
    <div class="toolbar">
      <h2 style="margin:0">${fmtDate(todayYmd())}</h2>

/** この1週間（今日を除く平日）で記録のない日 */
function missingDaysPanel() {
  const days = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today(), -i);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const ymd = toYmd(d);
    if (!myRecords().some(r => r.date <= ymd && (r.endDate || r.date) >= ymd)) days.push(ymd);
  }
  if (!days.length) return "";
  return `<div class="panel"><h3>この1週間で記録のない日</h3>
    <div class="toolbar" style="margin-bottom:0">${days.map(ymd =>
      `<button class="btn" data-action="addRecordOn" data-date="${ymd}">${fmtDate(ymd)} を記録</button>`).join("")}</div>
    <div class="muted">休みの日や、記録することがなかった日はそのままで大丈夫です。</div></div>`;
}

function recordList(recs, opts = {}) {
  if (!recs.length) return `<div class="empty">記録はまだありません</div>`;
  return `<ul class="items">${recs.map(r => {
    const t = taskById(r.taskId);
    const period = r.endDate && r.endDate !== r.date ? `${fmtDate(r.date)} 〜 ${fmtDate(r.endDate)}` : fmtDate(r.date);
    return `<li>${opts.select ? `<input type="checkbox" class="selRec" value="${r.id}" ${ui.sel.has(r.id) ? "checked" : ""} style="margin-top:6px;transform:scale(1.3)">` : ""}<div class="body">
      <div>${t ? `<span class="tag cat">${esc(t.category || "未分類")}</span>` : '<span class="tag warn">業務未登録</span>'}
        <span class="title">${esc(recordTitle(r))}</span>
        ${r.partial ? '<span class="tag warn">途中</span>' : ""}
        ${r.hours ? `<span class="muted">${r.hours}時間</span>` : ""}</div>
      <div class="muted">${period}${r.occ && t ? `　（${fmtMonthKey(r.occ)}分）` : ""}</div>
      ${r.content ? `<div class="pre">${esc(r.content)}</div>` : ""}
      ${r.notes ? `<div class="pre muted">📝 ${esc(r.notes)}</div>` : ""}
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <button class="btn small" data-action="editRecord" data-id="${r.id}">編集</button>
      ${!t ? `<button class="btn small" data-action="taskFromRecord" data-id="${r.id}">業務に登録</button>` : ""}
    </div></li>`;
  }).join("")}</ul>`;
}

/* ----- 年間予定表 ----- */
function viewYear() {
  const fy = ui.fy;
  const months = fyMonths();
  const curKey = thisMonthKey();
  // 「すべての役職」では役職ごと、通常は分類ごとに並べる
  const all = !!ui.yearAll;
  const viewRecords = all ? data.records : myRecords();
  const activeTasks = (all ? data.tasks : myTasks()).filter(t => !t.archived);
  const groupOf = t => all ? t.role : (t.category || "未分類");
  const byCat = {};
  activeTasks.forEach(t => (byCat[groupOf(t)] = byCat[groupOf(t)] || []).push(t));
  const cats = Object.keys(byCat).sort((a, b) => all ? data.settings.roles.indexOf(a) - data.settings.roles.indexOf(b) : a.localeCompare(b, "ja"));

  const rows = cats.map(cat => {
    const taskRows = byCat[cat].sort((a, b) => a.title.localeCompare(b.title, "ja")).map(t => {
      const occs = occurrencesInFy(t, fy);
      const cells = months.map(m => {
        const key = `${calYear(fy, m)}-${pad(m)}`;
        const occ = occs.find(o => o.m === m);
        const recs = viewRecords.filter(r => r.taskId === t.id && (r.occ || r.date.slice(0, 7)) === key);
        let cls = "", txt = "";
        if (occ) {
          const st = occStatus(occ);
          cls = { done: "done", partial: "plan", late: "late", plan: "plan" }[st];
          txt = st === "done" ? "✓" : st === "partial" ? "途中" : (t.day ? t.day + "日" : "●");
        } else if (recs.length) {
          cls = "extra"; txt = "✓";
        }
        if (key === curKey) cls += " now";
        return `<td class="cell ${cls}" data-action="cell" data-task="${t.id}" data-occ="${key}" title="${esc(t.title)} ${fmtMonthKey(key)}">${txt}</td>`;
      }).join("");
      const freq = t.everyN > 1 ? ` <span class="tag warn">${t.everyN}年毎</span>` : "";
      const cat = all && t.category ? ` <span class="muted">${esc(t.category)}</span>` : "";
      return `<tr><th class="task"><button class="link" data-action="openManual" data-id="${t.id}">${esc(t.title)}</button>${freq}${cat}</th>${cells}</tr>`;
    }).join("");
    return `<tr class="cat-row"><th colspan="13">${esc(cat)}</th></tr>` + taskRows;
  }).join("");

  // 業務に紐付いていない記録の件数
  const loose = months.map(m => {
    const key = `${calYear(fy, m)}-${pad(m)}`;
    const n = viewRecords.filter(r => !taskById(r.taskId) && r.date.slice(0, 7) === key).length;
    return `<td class="cell" data-action="looseMonth" data-occ="${key}">${n ? n + "件" : ""}</td>`;
  }).join("");

  // 年度内に予定がある業務を月ごとに一覧（印刷・説明用）
  const monthly = months.map(m => {
    const key = `${calYear(fy, m)}-${pad(m)}`;
    const items = activeTasks.flatMap(t => occurrencesInFy(t, fy)).filter(o => o.key === key)
      .sort((a, b) => (a.task.day || 99) - (b.task.day || 99));
    return `<div class="panel" style="margin-bottom:8px"><h3>${m}月</h3>${items.length ? `<ul class="items">${items.map(o =>
      `<li><div class="body">${o.task.day ? `<b>${o.task.day}日</b>　` : ""}${esc(o.task.title)} <span class="muted">${esc(all ? o.task.role : o.task.category || "")}</span></div></li>`).join("")}</ul>` : '<div class="muted">予定なし</div>'}</div>`;
  }).join("");

  return `
    <div class="toolbar">
      <button class="btn" data-action="fyPrev">◀</button>
      <h2 style="margin:0">${fyLabel(fy)} 年間予定表</h2>
      <button class="btn" data-action="fyNext">▶</button>
      <button class="btn" data-action="fyToday">今年度</button>
      <span style="margin-left:12px">表示：</span>
      <button class="btn ${all ? "" : "primary"}" data-action="yearRole">${esc(curRole())}だけ</button>
      <button class="btn ${all ? "primary" : ""}" data-action="yearAll">すべての役職</button>
      <span class="spacer"></span>
      <button class="btn" data-action="addTask">＋ 業務を登録</button>
      <button class="btn" data-action="exportXlsx">Excelで保存</button>
      <button class="btn" data-action="print">印刷</button>
    </div>
    <div class="panel year-table-wrap">
      ${activeTasks.length ? `<table class="year">
        <thead><tr><th class="task">${all ? "役職 / 業務" : "業務"}</th>${months.map(m => `<th>${m}月</th>`).join("")}</tr></thead>
        <tbody>${rows}
          <tr class="cat-row"><th colspan="13">業務一覧にない記録（日誌）</th></tr>
          <tr><th class="task muted">件数</th>${loose}</tr>
        </tbody></table>` : '<div class="empty">業務が登録されていません。「＋ 業務を登録」から追加してください。</div>'}
      <div class="legend">
        <span class="l-plan">予定（数字は期限日）</span><span class="l-done">実施済み</span>
        <span class="l-late">期限月を過ぎて未実施</span><span class="l-extra">予定外の月に実施</span>
        <span class="muted">セルをクリックすると記録を入力・確認できます</span>
      </div>
    </div>
    <h3>月別の予定</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">${monthly}</div>`;
}

/* ----- 業務日誌 ----- */
function filteredRecords() {
  const q = ui.journalQuery.trim().toLowerCase();
  return myRecords().filter(r => {
    if (ui.journalMonth && r.date.slice(0, 7) !== ui.journalMonth) return false;
    if (ui.journalTask === "__none") { if (taskById(r.taskId)) return false; }
    else if (ui.journalTask && r.taskId !== ui.journalTask) return false;
    if (q && ![recordTitle(r), r.content, r.notes].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}

function viewJournal() {
  const recs = filteredRecords().sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));
  const totalHours = recs.reduce((s, r) => s + (Number(r.hours) || 0), 0);
  // 月ごとに見出しを付ける
  const groups = {};
  recs.forEach(r => (groups[r.date.slice(0, 7)] = groups[r.date.slice(0, 7)] || []).push(r));

  return `
    <div class="toolbar">
      <h2 style="margin:0">業務日誌（実施記録）</h2>
      <span class="spacer"></span>
      <button class="btn primary" data-action="addRecord">＋ 記録を追加</button>
      <label class="btn">Excel・Wordから取り込み<input type="file" accept=".xlsx,.xlsm,.docx" class="importOffice" hidden></label>
      <button class="btn" data-action="exportXlsxJournal" title="いま絞り込んでいる記録を書き出します">Excelで保存</button>
      <button class="btn" data-action="exportCsv">CSVで書き出す</button>
    </div>
    <div class="panel">
      <div class="toolbar" style="margin-bottom:0">
        <label>月 <input type="month" id="jMonth" value="${esc(ui.journalMonth)}"></label>
        <label>業務 <select id="jTask">
          <option value="">すべて</option>
          <option value="__none" ${ui.journalTask === "__none" ? "selected" : ""}>（業務未登録の記録のみ）</option>
          ${taskOptions(ui.journalTask)}
        </select></label>
        <input type="search" id="jQuery" placeholder="キーワード検索" value="${esc(ui.journalQuery)}">
        <button class="btn small" data-action="jClear">条件クリア</button>
        <span class="spacer"></span>
        <span class="muted">${recs.length}件${totalHours ? ` / 合計 ${round1(totalHours)} 時間` : ""}</span>
      </div>
    </div>
    ${recs.length ? `<div class="toolbar">
      <button class="btn small" data-action="selAllRec">表示中の ${recs.length} 件をすべて選択</button>
      <button class="btn small" data-action="selNone">選択を解除</button>
      <button class="btn small danger" data-action="deleteSelRec">選択した <b id="selCount">${[...ui.sel].filter(id => recs.some(r => r.id === id)).length}</b> 件を削除</button>
      <span class="muted">左のチェックで選べます。月・業務・キーワードで絞り込んでから「すべて選択」すると、まとめて削除できます。</span>
    </div>` : ""}
    ${Object.keys(groups).length ? Object.keys(groups).sort().reverse().map(k =>
      `<div class="panel"><h3>${fmtMonthKey(k)}</h3>${recordList(groups[k], { select: true })}</div>`).join("")
      : '<div class="panel"><div class="empty">該当する記録はありません</div></div>'}`;
}

function taskOptions(selected) {
  const byCat = {};
  myTasks().forEach(t => (byCat[t.category || "未分類"] = byCat[t.category || "未分類"] || []).push(t));
  return Object.keys(byCat).sort((a, b) => a.localeCompare(b, "ja")).map(c =>
    `<optgroup label="${esc(c)}">${byCat[c].sort((a, b) => a.title.localeCompare(b.title, "ja")).map(t =>
      `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${esc(t.title)}${t.archived ? "（廃止）" : ""}</option>`).join("")}</optgroup>`).join("");
}

/* ----- 業務一覧 ----- */
function viewTasks() {
  const q = ui.taskQuery.trim().toLowerCase();
  const tasks = myTasks().filter(t => !q || [t.title, t.category, t.purpose, t.steps, t.tips].join(" ").toLowerCase().includes(q));
  const byCat = {};
  tasks.forEach(t => (byCat[t.category || "未分類"] = byCat[t.category || "未分類"] || []).push(t));
  const loose = myRecords().filter(r => !taskById(r.taskId)).length;

  return `
    <div class="toolbar">
      <h2 style="margin:0">業務一覧</h2>
      <input type="search" id="tQuery" placeholder="業務を検索" value="${esc(ui.taskQuery)}">
      <span class="spacer"></span>
      <label class="btn">Excel・Wordから取り込み<input type="file" accept=".xlsx,.xlsm,.docx" class="importOffice" hidden></label>
      <button class="btn primary" data-action="addTask">＋ 業務を登録</button>
    </div>
    ${loose ? `<div class="banner" style="background:var(--accent-soft);border-color:#bfe3d8;color:var(--accent-dark)">
      業務一覧に登録されていない日誌が ${loose} 件あります。繰り返し行う業務なら「業務に登録」しておくと、年間予定とマニュアルに反映されます。
      <button class="btn" data-action="showLoose">確認する</button></div>` : ""}
    ${tasks.length ? `<div class="toolbar">
      <button class="btn small" data-action="selAllTask">表示中の ${tasks.length} 件をすべて選択</button>
      <button class="btn small" data-action="selNone">選択を解除</button>
      <button class="btn small danger" data-action="deleteSelTask">選択した <b id="selCount">${[...ui.selT].filter(id => tasks.some(t => t.id === id)).length}</b> 件を削除</button>
      <span>選択したものを <select id="moveRole">${data.settings.roles.filter(r => r !== curRole()).map(r => `<option>${esc(r)}</option>`).join("")}</select></span>
      <button class="btn small" data-action="moveSelTask">へ移す</button>
      <span class="muted">左のチェックで選べます（検索で絞り込んでから「すべて選択」も可）。</span>
    </div>` : ""}
    ${Object.keys(byCat).sort((a, b) => a.localeCompare(b, "ja")).map(c => `
      <div class="panel"><h3>${esc(c)}</h3><ul class="items">
      ${byCat[c].sort((a, b) => a.title.localeCompare(b.title, "ja")).map(t => {
        const st = taskStats(t);
        return `<li><input type="checkbox" class="selTask" value="${t.id}" ${ui.selT.has(t.id) ? "checked" : ""} style="margin-top:6px;transform:scale(1.3)"><div class="body">
          <div><span class="title">${esc(t.title)}</span> ${t.archived ? '<span class="tag">廃止</span>' : ""}</div>
          <div class="muted">${esc(scheduleText(t))}　/　実施記録 ${st.count} 回${st.last ? `（最終 ${fmtDate(st.last)}）` : ""}</div>
        </div>
        <button class="btn small" data-action="openManual" data-id="${t.id}">マニュアル</button>
        <button class="btn small" data-action="addRecord" data-task="${t.id}">記録</button>
        <button class="btn small" data-action="editTask" data-id="${t.id}">編集</button></li>`;
      }).join("")}</ul></div>`).join("") || '<div class="panel"><div class="empty">業務が登録されていません</div></div>'}`;
}

/* ----- マニュアル ----- */
function viewManual() {
  const s = data.settings;
  const tasks = myTasks()
    .filter(t => !ui.manualTask || t.id === ui.manualTask)
    .sort((a, b) => (a.category || "").localeCompare(b.category || "", "ja") || firstMonthOrder(a) - firstMonthOrder(b) || a.title.localeCompare(b.title, "ja"));

  return `
    <div class="toolbar">
      <h2 style="margin:0">業務マニュアル</h2>
      <select id="mTask"><option value="">すべての業務</option>${taskOptions(ui.manualTask)}</select>
      <span class="spacer"></span>
      ${ui.manualTask ? `<button class="btn" data-action="editTask" data-id="${ui.manualTask}">この業務を編集</button>
        <button class="btn" data-action="addRecord" data-task="${ui.manualTask}">実施を記録</button>` : ""}
      <button class="btn" data-action="exportDocx">Wordで保存</button>
      <button class="btn" data-action="exportXlsx">Excelで保存</button>
      <button class="btn" data-action="print">印刷 / PDF</button>
      <button class="btn" data-action="exportMd">テキストで保存</button>
    </div>
    ${!ui.manualTask ? `<div class="panel">
      <h2>${esc([s.org, curRole()].filter(Boolean).join(" "))} 業務マニュアル</h2>
      <div class="muted">作成日 ${fmtDate(todayYmd())}　/　登録業務 ${myTasks().length} 件　/　実施記録 ${myRecords().length} 件
        ${myRecords().length ? `（${fmtDate([...myRecords()].sort((a, b) => a.date.localeCompare(b.date))[0].date)} 〜）` : ""}</div>
      <h4>年間の流れ</h4>${yearFlowTable()}
    </div>` : ""}
    ${tasks.map(manualSection).join("") || '<div class="panel"><div class="empty">業務が登録されていません</div></div>'}`;
}

function firstMonthOrder(t) {
  if (!t.months.length) return 99;
  return Math.min(...t.months.map(m => fyMonths().indexOf(m)));
}

function yearFlowTable() {
  const rows = fyMonths().map(m => {
    const ts = myTasks().filter(t => !t.archived && t.months.includes(m))
      .sort((a, b) => (a.day || 99) - (b.day || 99));
    const multi = ts.filter(t => t.everyN > 1);
    const yearly = ts.filter(t => t.everyN === 1 && t.months.length < 12);
    return `<tr><th>${m}月</th><td>${yearly.map(t => esc(t.title) + (t.day ? `（${t.day}日）` : "")).join("、") || ""}
      ${multi.length ? `<div class="muted">数年ごと: ${multi.map(t => esc(t.title) + `（${t.everyN}年毎）`).join("、")}</div>` : ""}</td></tr>`;
  }).join("");
  const monthly = myTasks().filter(t => !t.archived && t.months.length === 12);
  const irregular = myTasks().filter(t => !t.archived && !t.months.length);
  return `<table class="kv">
    ${monthly.length ? `<tr><th>毎月</th><td>${monthly.map(t => esc(t.title) + (t.day ? `（${t.day}日）` : "")).join("、")}</td></tr>` : ""}
    ${rows}
    ${irregular.length ? `<tr><th>随時・不定期</th><td>${irregular.map(t => esc(t.title)).join("、")}</td></tr>` : ""}
  </table>`;
}

function manualSection(t) {
  const st = taskStats(t);
  const steps = (t.steps || "").split("\n").map(x => x.trim()).filter(Boolean);
  const maxMonth = Math.max(1, ...st.monthCount);
  const months = fyMonths();
  const hist = st.keys.slice().reverse().map(k => {
    const g = st.groups[k];
    return `<div class="history-item">
      <b>${fmtMonthKey(k)}分</b>
      ${g.map(r => `<div><span class="muted">${fmtDate(r.date)}${r.endDate && r.endDate !== r.date ? "〜" + fmtDate(r.endDate) : ""}${r.hours ? "　" + r.hours + "時間" : ""}${r.partial ? "　（途中）" : ""}</span>
        ${r.content ? `<div class="pre">${esc(r.content)}</div>` : ""}
        ${r.notes ? `<div class="pre">📝 ${esc(r.notes)}</div>` : ""}</div>`).join("")}
    </div>`;
  }).join("");
  const allNotes = st.recs.filter(r => r.notes);

  return `<div class="panel manual-task">
    <h3>${esc(t.title)} ${t.archived ? '<span class="tag">廃止</span>' : ""}</h3>
    <table class="kv">
      <tr><th>分類</th><td>${esc(t.category || "未分類")}</td></tr>
      <tr><th>実施時期（予定）</th><td>${esc(scheduleText(t))}</td></tr>
      <tr><th>準備開始の目安</th><td>${t.leadDays ? `期限の ${t.leadDays} 日前から` : "—"}${st.avgLead != null ? `<span class="muted">　（実績: 平均 ${round1(st.avgLead)} 日前に着手）</span>` : ""}</td></tr>
      <tr><th>所要日数の目安</th><td>${t.durationDays ? `${t.durationDays} 日` : "—"}${st.avgDuration ? `<span class="muted">　（実績: 平均 ${round1(st.avgDuration)} 日、${st.minDuration}〜${st.maxDuration} 日）</span>` : ""}</td></tr>
      <tr><th>作業時間の目安</th><td>${t.hours ? `${t.hours} 時間` : "—"}${st.avgHours ? `<span class="muted">　（実績: 1回あたり平均 ${round1(st.avgHours)} 時間）</span>` : ""}</td></tr>
      <tr><th>実施実績</th><td>${st.count ? `${st.count} 回（${st.years.map(fyLabel).join("・")}）` : "まだ記録がありません"}</td></tr>
      ${st.count ? `<tr><th>実際に着手した月</th><td>
        <div class="bars">${months.map(m => `<div style="height:${st.monthCount[m] / maxMonth * 100}%" title="${m}月: ${st.monthCount[m]}回"></div>`).join("")}</div>
        <div class="bars-label">${months.map(m => `<span>${m}</span>`).join("")}</div>
        ${!t.months.length ? `<div class="muted">実績から見ると主に ${topMonths(st.monthCount)} に行われています</div>` : ""}
      </td></tr>` : ""}
      ${t.related ? `<tr><th>関係先・資料</th><td class="pre">${esc(t.related)}</td></tr>` : ""}
    </table>
    ${t.purpose ? `<h4>目的・概要</h4><div class="pre">${esc(t.purpose)}</div>` : ""}
    ${steps.length ? `<h4>手順</h4><ol>${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${t.tips ? `<h4>注意点・コツ</h4><div class="pre">${esc(t.tips)}</div>` : ""}
    ${allNotes.length ? `<h4>過去の申し送り（新しい順）</h4><ul>${allNotes.slice().reverse().map(r => `<li><span class="muted">${fmtDate(r.date)}</span>　<span class="pre">${esc(r.notes)}</span></li>`).join("")}</ul>` : ""}
    ${hist ? `<h4>実施の記録</h4>${hist}` : ""}
  </div>`;
}

function topMonths(mc) {
  const max = Math.max(...mc);
  if (!max) return "—";
  return mc.map((n, m) => ({ n, m })).filter(x => x.n && x.n >= max * 0.5).map(x => x.m + "月").join("・");
}

/* ----- 使い方 ----- */

    <h3>${icon} ${title}</h3>${body}</div></div>`;
  return `
    <div class="toolbar">
      <h2 style="margin:0">❓ かんたん使い方</h2>
      <span class="spacer"></span>
      <button class="btn" data-action="print">この使い方を印刷</button>
    </div>
    <div class="panel help">
      <p>このアプリは、<b>毎日の仕事を記録していくと、数年後には役職ごとの「業務マニュアル」ができあがる</b>帳簿です。
        インターネットにはつながず、このパソコンの中だけで動きます。</p>
    </div>

    <div class="panel help">
      <h2>はじめに（最初の1回だけ）</h2>

/* ===================== ダイアログ ===================== */

const taskDialog = document.getElementById("taskDialog");
const taskForm = document.getElementById("taskForm");
const recordDialog = document.getElementById("recordDialog");
const recordForm = document.getElementById("recordForm");

document.getElementById("monthChecks").innerHTML =
  Array.from({ length: 12 }, (_, i) => `<label><input type="checkbox" name="m" value="${i + 1}">${i + 1}月</label>`).join("");

function openTaskDialog(task, preset) {
  const t = task || Object.assign({ id: "", title: "", category: "", months: [], day: "", everyN: 1, baseYear: fyOf(today()),
    leadDays: "", durationDays: "", hours: "", purpose: "", steps: "", tips: "", related: "", archived: false }, preset || {});
  document.getElementById("taskDialogTitle").textContent = task ? "業務を編集" : "業務を登録";
  const f = taskForm.elements;
  ["id", "title", "category", "day", "baseYear", "leadDays", "durationDays", "hours", "purpose", "steps", "tips", "related"]
    .forEach(k => f[k].value = t[k] == null ? "" : t[k]);
  f.everyN.value = String(t.everyN || 1);
  if (![...f.everyN.options].some(o => o.value === f.everyN.value)) {
    f.everyN.add(new Option(`${t.everyN}年に1回`, String(t.everyN)));
    f.everyN.value = String(t.everyN);
  }
  f.archived.checked = !!t.archived;
  taskForm.querySelectorAll("input[name=m]").forEach(cb => cb.checked = t.months.includes(Number(cb.value)));
  document.getElementById("taskDelete").style.display = task ? "" : "none";
  taskForm.dataset.fromRecord = (preset && preset._fromRecord) || "";
  taskDialog.showModal();
}

taskForm.addEventListener("submit", e => {
  e.preventDefault();
  const f = taskForm.elements;
  const id = f.id.value || uid();
  const t = {
    id,
    title: f.title.value.trim(),
    category: f.category.value.trim(),
    months: [...taskForm.querySelectorAll("input[name=m]:checked")].map(cb => Number(cb.value)),
    day: f.day.value ? Number(f.day.value) : "",
    everyN: Number(f.everyN.value) || 1,
    baseYear: f.baseYear.value ? Number(f.baseYear.value) : fyOf(today()),
    leadDays: f.leadDays.value ? Number(f.leadDays.value) : "",
    durationDays: f.durationDays.value ? Number(f.durationDays.value) : "",
    hours: f.hours.value ? Number(f.hours.value) : "",
    purpose: f.purpose.value, steps: f.steps.value, tips: f.tips.value, related: f.related.value,
    archived: f.archived.checked
  };
  if (!t.title) return;
  const i = data.tasks.findIndex(x => x.id === id);
  if (i >= 0) data.tasks[i] = Object.assign(data.tasks[i], t);
  else { t.createdAt = new Date().toISOString(); t.role = curRole(); data.tasks.push(t); }
  // 日誌から業務を作った場合は、その記録を紐付ける
  const fromRec = taskForm.dataset.fromRecord;
  if (fromRec) {
    const r = data.records.find(x => x.id === fromRec);
    if (r) { r.taskId = id; r.occ = r.occ || r.date.slice(0, 7); }
    const sameTitle = myRecords().filter(x => !taskById(x.taskId) && r && x.title && x.title.trim() === (r.title || "").trim());
    if (sameTitle.length && confirm(`同じ件名「${r.title}」の未登録の記録が他に ${sameTitle.length} 件あります。まとめてこの業務に紐付けますか？`)) {
      sameTitle.forEach(x => { x.taskId = id; x.occ = x.occ || x.date.slice(0, 7); });
    }
  }
  save();
  taskDialog.close();
  render();
});

document.getElementById("taskDelete").addEventListener("click", () => {
  const id = taskForm.elements.id.value;
  const n = data.records.filter(r => r.taskId === id).length;
  if (!confirm(n ? `この業務を削除します。実施記録 ${n} 件は「業務未登録」の記録として残ります。よろしいですか？\n（行っていない業務は「廃止」にチェックするのがおすすめです）`
                 : "この業務を削除します。よろしいですか？")) return;
  const t = taskById(id);
  data.records.forEach(r => { if (r.taskId === id) { r.title = r.title || t.title; r.taskId = ""; } });
  data.tasks = data.tasks.filter(x => x.id !== id);
  if (ui.manualTask === id) ui.manualTask = "";
  save();
  taskDialog.close();
  render();
});

taskForm.addEventListener("click", e => {
  const b = e.target.closest("[data-months]");
  if (!b) return;
  const mode = b.dataset.months;
  taskForm.querySelectorAll("input[name=m]").forEach(cb => {
    const m = Number(cb.value);
    cb.checked = mode === "all" ? true : mode === "quarter" ? [1, 4, 7, 10].includes(m) : false;
  });
});

function openRecordDialog(rec, preset) {
  const r = rec || Object.assign({ id: "", taskId: "", title: "", date: todayYmd(), endDate: "", hours: "", occ: "", content: "", notes: "", partial: false }, preset || {});
  document.getElementById("recordDialogTitle").textContent = rec ? "実施記録を編集" : "実施記録を入力";
  const sel = document.getElementById("recordTaskSelect");
  sel.innerHTML = `<option value="">（業務一覧にない業務・その他）</option>` + taskOptions(r.taskId);
  const f = recordForm.elements;
  ["id", "title", "date", "endDate", "hours", "occ", "content", "notes"].forEach(k => f[k].value = r[k] == null ? "" : r[k]);
  f.taskId.value = r.taskId || "";
  f.partial.checked = !!r.partial;
  // 1週間前までさかのぼって入れられるよう、日付ボタンを並べる
  document.getElementById("dayButtons").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(today(), -i);
    const label = i === 0 ? "今日" : i === 1 ? "昨日" : `${d.getMonth() + 1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
    return `<button type="button" class="btn small" data-day="${-i}">${label}</button>`;
  }).join("");
  syncRecordForm();
  document.getElementById("recordDelete").style.display = rec ? "" : "none";
  recordDialog.showModal();
}

function syncRecordForm() {
  const f = recordForm.elements;
  const hasTask = !!f.taskId.value;
  document.getElementById("recordTitleRow").style.display = hasTask ? "none" : "";
  document.getElementById("recordOccRow").style.display = hasTask ? "" : "none";
  if (hasTask && !f.occ.value && f.date.value) f.occ.value = f.date.value.slice(0, 7);
  const t = taskById(f.taskId.value);
  let hintEl = document.getElementById("recordHint");
  if (!hintEl) {
    hintEl = document.createElement("div");
    hintEl.id = "recordHint";
    hintEl.className = "muted";
    hintEl.style.marginTop = "4px";
    document.getElementById("recordTaskSelect").after(hintEl);
  }
  if (t) {
    const st = taskStats(t);
    const last = st.recs.filter(r => r.id !== f.id.value).pop();
    hintEl.innerHTML = [
      esc(scheduleText(t)),
      st.avgDuration ? `実績 平均${round1(st.avgDuration)}日` : "",
      st.avgHours ? `約${round1(st.avgHours)}時間` : "",

recordForm.addEventListener("submit", e => {
  e.preventDefault();
  const f = recordForm.elements;
  if (!f.date.value) return;
  if (!f.taskId.value && !f.title.value.trim() && !f.content.value.trim()) {
    alert("業務を選ぶか、件名・やったことのどれかを入力してください。");
    return;
  }
  if (f.endDate.value && f.endDate.value < f.date.value) { alert("終了日が開始日より前になっています。"); return; }
  const id = f.id.value || uid();
  const r = {
    id,
    taskId: f.taskId.value,
    title: f.taskId.value ? "" : f.title.value.trim(),
    date: f.date.value,
    endDate: f.endDate.value,
    hours: f.hours.value ? Number(f.hours.value) : "",
    occ: f.taskId.value ? (f.occ.value || f.date.value.slice(0, 7)) : "",
    content: f.content.value,
    notes: f.notes.value,
    partial: f.partial.checked
  };
  const i = data.records.findIndex(x => x.id === id);
  if (i >= 0) data.records[i] = Object.assign(data.records[i], r);
  else { r.createdAt = new Date().toISOString(); r.role = curRole(); data.records.push(r); }
  if (ui.reminding) stopRemind(true);
  save();
  recordDialog.close();
  render();
});

// .docx / .xlsx は ZIP 形式。外部ライブラリなしで動くよう、無圧縮の ZIP を自前で作る
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => {
    const name = enc.encode(f.name);
    const body = enc.encode(f.text);
    const crc = crc32(body);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, body.length, true);
    local.setUint32(22, body.length, true);
    local.setUint16(26, name.length, true);
    local.setUint16(28, 0, true);
    parts.push(new Uint8Array(local.buffer), name, body);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);
    cen.setUint16(4, 20, true);
    cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);
    cen.setUint16(10, 0, true);
    cen.setUint16(12, dosTime, true);
    cen.setUint16(14, dosDate, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, body.length, true);
    cen.setUint32(24, body.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, offset, true);
    central.push(new Uint8Array(cen.buffer), name);
    offset += 30 + name.length + body.length;
  });
  const cenSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cenSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}
function downloadBlob(name, blob) {
  const a = document.createElement("a");

function sheetXml(sheet) {

function yearSheet(fy) {
  const months = fyMonths();
  const H = v => ({ v, s: 1 });
  const rows = [
    [{ v: `${[data.settings.org, curRole()].filter(Boolean).join(" ")} ${fyLabel(fy)} 年間予定表`, s: 7 }],
    ["凡例: 数字=期限日（予定）／✓=実施済み／未実施=期限月を過ぎて未実施／予定外=予定のない月に実施"],
    [H("分類"), H("業務"), H("周期"), ...months.map(m => H(m + "月"))]
  ];
  sortedTasks().filter(t => !t.archived).forEach(t => {
    const occs = occurrencesInFy(t, fy);
    rows.push([{ v: t.category || "未分類", s: 2 }, { v: t.title, s: 2 }, { v: scheduleText(t), s: 2 }, ...months.map(m => {
      const key = `${calYear(fy, m)}-${pad(m)}`;
      const occ = occs.find(o => o.m === m);
      if (occ) {
        const st = occStatus(occ);
        if (st === "done") return { v: "✓", s: 3 };
        if (st === "late") return { v: "未実施", s: 5 };
        return { v: st === "partial" ? "途中" : (t.day ? t.day + "日" : "●"), s: 4 };
      }
      return recordsForOcc(t, key).length ? { v: "✓予定外", s: 6 } : { v: "", s: 2 };
    })]);
  });
  return { name: `${fyLabel(fy)}年間予定`, widths: [14, 30, 22, ...months.map(() => 8)], rows, freeze: 3, freezeCols: 2 };
}

function recordSheet(recs) {

  return String(text == null ? "" : text).split("\n").map((line, i) =>
    `<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ""}${i ? "<w:br/>" : ""}<w:t xml:space="preserve">${xml(line)}</w:t></w:r>`).join("");
}
function wP(text, opt = {}) {
  const ppr = [opt.style ? `<w:pStyle w:val="${opt.style}"/>` : "", opt.pageBreak ? "<w:pageBreakBefore/>" : "", opt.ind ? `<w:ind w:left="${opt.ind}" w:hanging="${opt.hanging || 0}"/>` : ""].join("");

<w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>

}

function manualDocBody(only) {

  if (!only) {

    const monthly = myTasks().filter(t => !t.archived && t.months.length === 12);
    if (monthly.length) rows.push(["毎月", monthly.map(label).join("、")]);
    fyMonths().forEach(m => rows.push([m + "月", myTasks().filter(t => !t.archived && t.months.includes(m) && t.months.length < 12)
      .sort((a, b) => (a.day || 99) - (b.day || 99)).map(label).join("、")]));

    if (irr.length) rows.push(["随時・不定期", irr.map(t => t.title).join("、")]);
    B.push(wTable(rows, [1600, 7400]));
  }
  tasks.forEach((t, idx) => {
    const st = taskStats(t);
    B.push(wP(t.title + (t.archived ? "（廃止）" : ""), { style: "Heading1", pageBreak: !only || idx > 0 }));
    const rows = [
      ["分類", t.category || "未分類"],
      ["実施時期（予定）", scheduleText(t)],
      ["準備開始の目安", (t.leadDays ? `期限の ${t.leadDays} 日前から` : "—") + (st.avgLead != null ? `（実績: 平均 ${round1(st.avgLead)} 日前に着手）` : "")],

      ["作業時間の目安", (t.hours ? `${t.hours} 時間` : "—") + (st.avgHours ? `（実績: 1回あたり平均 ${round1(st.avgHours)} 時間）` : "")],
      ["実施実績", st.count ? `${st.count} 回（${st.years.map(fyLabel).join("・")}）` : "まだ記録がありません"]
    ];
    if (st.count) rows.push(["実際に着手した月", fyMonths().filter(m => st.monthCount[m]).map(m => `${m}月×${st.monthCount[m]}`).join("　")]);
    if (t.related) rows.push(["関係先・資料", t.related]);
    B.push(wTable(rows));
    if (t.purpose) B.push(wP("目的・概要", { style: "Heading2" }), wP(t.purpose));
    const steps = (t.steps || "").split("\n").map(x => x.trim()).filter(Boolean);
    if (steps.length) B.push(wP("手順", { style: "Heading2" }), ...steps.map((x, i) => wP(`${i + 1}.　${x}`, { ind: 420, hanging: 420 })));
    if (t.tips) B.push(wP("注意点・コツ", { style: "Heading2" }), wP(t.tips));
    const notes = st.recs.filter(r => r.notes).reverse();
    if (notes.length) {
      B.push(wP("過去の申し送り（新しい順）", { style: "Heading2" }));
      notes.forEach(r => B.push(wP("", { ind: 420, hanging: 420, runs: wRun("・" + fmtDate(r.date) + "　", { color: "66788A" }) + wRun(r.notes) })));
    }
    if (st.keys.length) {
      B.push(wP("実施の記録", { style: "Heading2" }));
      const rows2 = [];
      st.keys.slice().reverse().forEach(k => st.groups[k].forEach(r => {

      }));
      B.push(wTable(rows2, [2600, 6400]));
    }
  });
  return B.join("\n");
}

/* ===================== Excel / Word からの取り込み ===================== */

/** ZIP（.xlsx / .docx）を展開して { ファイル名: Uint8Array } を返す */
async function readZip(buf) {
  const v = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
    if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Excel（.xlsx）か Word（.docx）のファイルではないようです。");
  const count = v.getUint16(eocd + 10, true);
  let p = v.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = {};
  for (let n = 0; n < count; n++) {
    const method = v.getUint16(p + 10, true);
    const csize = v.getUint32(p + 20, true);
    const nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
    const lho = v.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nlen));
    p += 46 + nlen + xlen + clen;
    if (!/\.(xml|rels)$/.test(name)) continue;
    const start = lho + 30 + v.getUint16(lho + 26, true) + v.getUint16(lho + 28, true);
    const raw = new Uint8Array(buf, start, csize);
    if (method === 0) out[name] = raw;
    else if (method === 8) {
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      out[name] = new Uint8Array(await new Response(stream).arrayBuffer());
    }
  }
  return out;
}
function parseXml(bytes) { return new DOMParser().parseFromString(new TextDecoder().decode(bytes), "application/xml"); }
function byTag(node, tag) { return [...node.getElementsByTagName("*")].filter(e => e.localName === tag); }
function childTags(node, tag) { return [...node.children].filter(e => e.localName === tag); }

/** .xlsx → [{ name, rows: [[値]] }] */
async function readXlsx(buf) {
  const z = await readZip(buf);
  if (!z["xl/workbook.xml"]) throw new Error("Excel ファイルとして読めませんでした。");
  const shared = z["xl/sharedStrings.xml"] ? byTag(parseXml(z["xl/sharedStrings.xml"]), "si").map(richText) : [];
  const rels = {};
  byTag(parseXml(z["xl/_rels/workbook.xml.rels"]), "Relationship").forEach(r => rels[r.getAttribute("Id")] = r.getAttribute("Target"));
  return byTag(parseXml(z["xl/workbook.xml"]), "sheet").map(sh => {
    const rid = sh.getAttribute("r:id") || [...sh.attributes].find(a => a.localName === "id").value;
    let target = rels[rid].replace(/^\//, "");
    if (!target.startsWith("xl/")) target = "xl/" + target;
    const rows = [];
    if (!z[target]) return { name: sh.getAttribute("name"), rows };
    byTag(parseXml(z[target]), "row").forEach(row => {
      const r = Number(row.getAttribute("r")) - 1;
      const arr = rows[r] = [];
      childTags(row, "c").forEach((c, idx) => {
        const ref = c.getAttribute("r");
        const col = ref ? colIndex(ref.replace(/\d+/g, "")) : idx;
        const t = c.getAttribute("t");
        const vEl = childTags(c, "v")[0];
        let val = "";
        if (t === "s") val = shared[Number(vEl && vEl.textContent)] || "";
        else if (t === "inlineStr") val = childTags(c, "is").map(richText).join("");
        else if (vEl) val = t === "str" || t === "e" ? vEl.textContent : Number(vEl.textContent);
        arr[col] = val;
      });
    });
    for (let i = 0; i < rows.length; i++) rows[i] = rows[i] || [];
    return { name: sh.getAttribute("name"), rows };
  });
}
/** セルの文字（ふりがな＝rPh の部分は含めない） */
function richText(el) {
  return [...el.children].map(ch => ch.localName === "t" ? ch.textContent : ch.localName === "r" ? childTags(ch, "t").map(t => t.textContent).join("") : "").join("");
}
function colIndex(letters) { let n = 0; for (const ch of letters) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }

/** .docx → 表ごと＋表の外の文章 [{ name, rows }] */
async function readDocx(buf) {
  const z = await readZip(buf);
  if (!z["word/document.xml"]) throw new Error("Word ファイルとして読めませんでした。");
  const doc = parseXml(z["word/document.xml"]);
  const paraText = p => [...p.getElementsByTagName("*")].filter(e => e.localName === "t" || e.localName === "br" || e.localName === "tab")
    .map(e => e.localName === "t" ? e.textContent : e.localName === "br" ? "\n" : " ").join("");
  const tables = [];
  const loose = [];
  const body = byTag(doc, "body")[0];
  [...body.children].forEach(el => {
    if (el.localName === "tbl") {
      tables.push({ name: `表${tables.length + 1}`, rows: childTags(el, "tr").map(tr => childTags(tr, "tc").map(tc => childTags(tc, "p").map(paraText).join("\n").trim())) });
    } else if (el.localName === "p") {
      const t = paraText(el).trim();
      if (t) loose.push([t]);
    }
  });
  return [...tables, { name: "本文", rows: loose }];
}

/* ----- 日付の読み取り ----- */

const WAREKI = { "令和": 2018, "R": 2018, "平成": 1988, "H": 1988 };
/** 文字列や Excel の日付シリアル値から日付を読む。{ y?, m?, d, rest } / 読めなければ null */
function looseDate(v) {
  if (typeof v === "number") {
    if (v > 20000 && v < 80000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), rest: "" };
    }
    return null;
  }
  const s = String(v || "").trim().replace(/[０-９／．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m;
  const tail = str => str.replace(/^\s*[（(][日月火水木金土祝・]+[)）]/, "").replace(/^[\s:：\-－~〜、。]+/, "").trim();
  if ((m = s.match(/^(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})\s*日?/)))
    return { y: +m[1], m: +m[2], d: +m[3], rest: tail(s.slice(m[0].length)) };
  if ((m = s.match(/^(令和|平成|R|H)\s*(\d{1,2}|元)\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})\s*日?/i)))
    return { y: WAREKI[m[1].toUpperCase() === m[1] && m[1].length === 1 ? m[1].toUpperCase() : m[1]] + (m[2] === "元" ? 1 : +m[2]), m: +m[3], d: +m[4], rest: tail(s.slice(m[0].length)) };
  if ((m = s.match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?/)) && +m[1] >= 1 && +m[1] <= 12 && +m[2] <= 31)
    return { m: +m[1], d: +m[2], rest: tail(s.slice(m[0].length)) };
  if ((m = s.match(/^(\d{1,2})\s*日/)) && +m[1] >= 1 && +m[1] <= 31)
    return { d: +m[1], rest: tail(s.slice(m[0].length)) };
  return null;
}
/** シート名や見出しから「何年何月の表か」を読む */
function contextMonth(texts) {
  for (const t of texts) {
    const s = String(t || "");
    let m;
    if ((m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/))) return { y: +m[1], m: +m[2] };
    if ((m = s.match(/(令和|R)\s*(\d{1,2}|元)\s*年\s*(\d{1,2})\s*月/))) return { y: 2018 + (m[2] === "元" ? 1 : +m[2]), m: +m[3] };
    if ((m = s.match(/(\d{4})[\/\-.](\d{1,2})$/))) return { y: +m[1], m: +m[2] };
  }
  for (const t of texts) {
    const m = String(t || "").match(/(?:^|[^\d])(\d{1,2})\s*月(?!\s*\d)/);
    if (m && +m[1] >= 1 && +m[1] <= 12) return { m: +m[1] };
  }
  return null;
}
/** 予定・記録として意味のある文字か（曜日・勤務記号・数字だけのものは除く） */
function meaningful(s) {
  s = String(s == null ? "" : s).trim();
  if (s.length < 2) return false;
  if (/^[\d\s.:：\-\/～〜]+$/.test(s)) return false;
  if (/^[（(]?[日月火水木金土祝][曜日]*[)）]?$/.test(s)) return false;
  if (/^(休|公休|有休|年休|出|日勤|夜勤|早番|遅番|明|明け|[A-Za-z]{1,2}\d?)$/.test(s)) return false;
  if (/^[×✕○◯△→\s]*(日勤|夜勤|早番|遅番|休み?|公休|有休|出勤)?[×✕○◯△→\s]*$/.test(s)) return false;
  if (/^(メモ|備考|その他)$/.test(s)) return false;
  return true;
}

const COLS = {

  category: ["分類", "区分", "種別"],
  title: ["業務名", "業務", "件名", "行事", "行事名", "予定", "項目", "内容"],
  months: ["実施月", "月"],
  day: ["期限日", "日"],
  everyN: ["周期（年）", "周期(年)", "周期"],
  baseYear: ["基準年度"],
  leadDays: ["準備開始", "準備開始（期限の◯日前）"],
  durationDays: ["想定所要日数"],
  hours: ["想定作業時間", "作業時間", "時間"],
  purpose: ["目的・概要", "目的", "概要"],
  steps: ["手順"],
  tips: ["注意点・コツ", "注意点"],
