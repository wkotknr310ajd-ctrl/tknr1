<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>連絡ノート</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #16213a;
    --surface-2: #1d2b4a;
    --border: #2a3a5c;
    --text: #e6ebf5;
    --text-muted: #93a2c2;
    --primary: #4c7bf3;
    --danger: #ef5164;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #app-root {
    display: flex;
    height: 100vh;
    max-width: 960px;
    margin: 0 auto;
  }
  .thread-pane {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .thread-pane h1 {
    font-size: 1rem;
    margin: 0;
    padding: 0.9rem 1rem 0.5rem;
  }
  .whoami-box {
    padding: 0 1rem 0.8rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .whoami-box label {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .whoami-box select,
  .whoami-box input {
    width: 100%;
  }
  .whoami-custom {
    display: none;
  }
  .thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .thread-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 0.9rem;
  }
  .thread-item:hover { background: var(--surface-2); }
  .thread-item.active {
    background: var(--surface-2);
    border-color: var(--primary);
  }
  .thread-item-main {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .thread-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .thread-creator {
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .thread-item .thread-del {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.1rem 0.3rem;
    flex-shrink: 0;
  }
  .thread-item:hover .thread-del { opacity: 1; }
  .thread-item .thread-del:hover { color: var(--danger); }
  .new-thread-box {
    padding: 0.6rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
  }
  .new-thread-box input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font-size: 0.85rem;
  }
  .chat-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chat-header {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .chat-header .chat-title {
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chat-header .chat-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .empty-state {
    color: var(--text-muted);
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    line-height: 1.7;
  }
  .msg {
    max-width: 80%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 0.8rem;
    align-self: flex-start;
  }
  .msg-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .msg-name { font-weight: 600; color: var(--text); }
  .msg-text {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.92rem;
  }
  .msg-del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0;
  }
  .msg-del:hover { color: var(--danger); }
  .composer {
    border-top: 1px solid var(--border);
    padding: 0.8rem;
    display: flex;
    gap: 0.5rem;
  }
  select, textarea, input[type=text] {
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
  }
  .composer textarea {
    flex: 1;
    min-height: 2.6rem;
    max-height: 8rem;
    resize: vertical;
  }
  button {
    font-family: inherit;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 0.55rem 1rem;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { background: var(--border); }
  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .no-thread {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-align: center;
    padding: 1rem;
    line-height: 1.8;
  }
  @media (max-width: 640px) {
    #app-root { flex-direction: column; }
    .thread-pane { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script>
(function () {
  'use strict';
  const root = document.getElementById('app-root');
  const PRESET_NAMES = ['田巻', '羽田', '咲香', '智恵'];
  const THREADS_KEY = 'renraku-note-threads-v1';
  const CURRENT_KEY = 'renraku-note-current-thread-v1';
  const NAME_KEY = 'renraku-note-whoami-v1';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    const mo = d.getMonth() + 1, da = d.getDate();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return mo + '/' + da + ' ' + hh + ':' + mm;
  }
  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function loadThreads() {
    try {
      const raw = localStorage.getItem(THREADS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveThreads(threads) {
    try { localStorage.setItem(THREADS_KEY, JSON.stringify(threads)); } catch (e) {}
  }
  function loadCurrentId() {
    try { return localStorage.getItem(CURRENT_KEY); } catch (e) { return null; }
  }
  function saveCurrentId(id) {
    try { localStorage.setItem(CURRENT_KEY, id || ''); } catch (e) {}
  }
  function loadWhoAmI() {
    try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
  }
  function saveWhoAmI(name) {
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  }

  let threads = loadThreads();
  let currentId = loadCurrentId();
  if (!threads.find(function (t) { return t.id === currentId; })) {
    currentId = threads.length ? threads[0].id : null;
  }
  let whoAmI = loadWhoAmI();

  function currentThread() {
    return threads.find(function (t) { return t.id === currentId; }) || null;
  }

  function requireWhoAmI() {
    if (!whoAmI) {
      alert('まず画面左上で「あなたの名前」を選んでください。');
      return false;
    }
    return true;
  }

  function createThread(name) {
    if (!requireWhoAmI()) return;
    const t = { id: uid(), name: name, createdBy: whoAmI, createdAt: Date.now(), messages: [] };
    threads.push(t);
    saveThreads(threads);
    currentId = t.id;
    saveCurrentId(currentId);
    render();
  }

  function deleteThread(id) {
    const t = threads.find(function (x) { return x.id === id; });
    if (!t) return;
    if (!requireWhoAmI()) return;
    if (t.createdBy !== whoAmI) {
      alert('このスレッドを削除できるのは、作成した「' + t.createdBy + '」さんだけです。');
      return;
    }
    if (!confirm('スレッド「' + t.name + '」を削除します。中のやり取りもすべて消えます。よろしいですか?')) return;
    threads = threads.filter(function (x) { return x.id !== id; });
    saveThreads(threads);
    if (currentId === id) {
      currentId = threads.length ? threads[0].id : null;
      saveCurrentId(currentId);
    }
    render();
  }

  function selectThread(id) {
    currentId = id;
    saveCurrentId(currentId);
    render();
  }

  function postMessage(text) {
    if (!requireWhoAmI()) return;
    const t = currentThread();
    if (!t || !text.trim()) return;
    t.messages.push({ id: uid(), from: whoAmI, text: text.trim(), createdAt: Date.now() });
    saveThreads(threads);
    render();
    scrollMessagesToBottom();
  }

  function deleteMessage(msgId) {
    const t = currentThread();
    if (!t) return;
    if (!confirm('このメッセージを削除します。よろしいですか?')) return;
    t.messages = t.messages.filter(function (m) { return m.id !== msgId; });
    saveThreads(threads);
    render();
  }

  function scrollMessagesToBottom() {
    const el = root.querySelector('.chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  }

  function whoAmIBoxHtml() {
    const isPreset = PRESET_NAMES.indexOf(whoAmI) !== -1;
    return (
      '<div class="whoami-box">' +
        '<label>あなたの名前</label>' +
        '<select id="whoami-select">' +
          '<option value="">(選択してください)</option>' +
          PRESET_NAMES.map(function (n) {
            return '<option value="' + esc(n) + '"' + (n === whoAmI ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('') +
          '<option value="__custom__"' + (whoAmI && !isPreset ? ' selected' : '') + '>その他</option>' +
        '</select>' +
        '<input type="text" id="whoami-custom" class="whoami-custom" placeholder="名前を入力" value="' + (!isPreset ? esc(whoAmI) : '') + '" style="display:' + (!isPreset && whoAmI ? 'block' : 'none') + ';" />' +
      '</div>'
    );
  }

  function threadListHtml() {
    if (!threads.length) {
      return '<div class="empty-state" style="margin-top:1rem;">まだスレッドがありません。<br>下から作成してください。</div>';
    }
    return threads
      .slice()
      .sort(function (a, b) { return b.createdAt - a.createdAt; })
      .map(function (t) {
        const active = t.id === currentId ? ' active' : '';
        return (
          '<div class="thread-item' + active + '" data-thread-id="' + t.id + '">' +
            '<div class="thread-item-main">' +
              '<span class="thread-name">' + esc(t.name) + '</span>' +
              '<span class="thread-creator">' + esc(t.createdBy) + 'さんが作成</span>' +
            '</div>' +
            '<button class="thread-del" data-del-thread="' + t.id + '" title="削除(作成者のみ)">✕</button>' +
          '</div>'
        );
      })
      .join('');
  }

  function messagesHtml(t) {
    if (!t.messages.length) {
      return '<div class="empty-state">まだやり取りがありません。<br>下から投稿してください。</div>';
    }
    return t.messages
      .map(function (m) {
        return (
          '<div class="msg">' +
            '<div class="msg-meta">' +
              '<span class="msg-name">' + esc(m.from) + '</span>' +
              '<span>' + fmtTime(m.createdAt) + '</span>' +
              '<button class="msg-del" data-del-msg="' + m.id + '">削除</button>' +
            '</div>' +
            '<div class="msg-text">' + esc(m.text) + '</div>' +
          '</div>'
        );
      })
      .join('');
  }

  function render() {
    const t = currentThread();

    root.innerHTML =
      '<div class="thread-pane">' +
        '<h1>💬 連絡ノート</h1>' +
        whoAmIBoxHtml() +
        '<div class="thread-list">' + threadListHtml() + '</div>' +
        '<div class="new-thread-box">' +
          '<input type="text" id="new-thread-input" placeholder="新しいスレッド名" />' +
          '<button id="new-thread-btn">作成</button>' +
        '</div>' +
      '</div>' +
      '<div class="chat-pane">' +
        (t
          ? (
            '<div class="chat-header">' +
              '<div class="chat-title">' +
                '<span>' + esc(t.name) + '</span>' +
                '<span style="font-size:0.75rem; color: var(--text-muted); font-weight:400;">' + t.messages.length + '件</span>' +
              '</div>' +
              '<span class="chat-sub">作成者: ' + esc(t.createdBy) + '(削除できるのは本人のみ)</span>' +
            '</div>' +
            '<div class="chat-messages">' + messagesHtml(t) + '</div>' +
            '<div class="composer">' +
              '<textarea id="c-text" placeholder="メッセージを入力(Ctrl+Enterで送信)"></textarea>' +
              '<button class="primary" id="c-send">送信</button>' +
            '</div>'
          )
          : '<div class="no-thread">左のスレッド一覧から選ぶか、<br>新しいスレッドを作成してください。</div>'
        ) +
      '</div>';

    scrollMessagesToBottom();

    const whoamiSelect = document.getElementById('whoami-select');
    const whoamiCustom = document.getElementById('whoami-custom');
    whoamiSelect.addEventListener('change', function () {
      if (whoamiSelect.value === '__custom__') {
        whoamiCustom.style.display = 'block';
        whoamiCustom.focus();
      } else {
        whoamiCustom.style.display = 'none';
        whoAmI = whoamiSelect.value;
        saveWhoAmI(whoAmI);
        render();
      }
    });
    whoamiCustom.addEventListener('change', function () {
      whoAmI = whoamiCustom.value.trim();
      saveWhoAmI(whoAmI);
    });
    whoamiCustom.addEventListener('blur', function () {
      whoAmI = whoamiCustom.value.trim();
      saveWhoAmI(whoAmI);
    });

    root.querySelectorAll('[data-thread-id]').forEach(function (el) {
      el.addEventListener('click', function () { selectThread(el.getAttribute('data-thread-id')); });
    });
    root.querySelectorAll('[data-del-thread]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteThread(el.getAttribute('data-del-thread'));
      });
    });
    root.querySelectorAll('[data-del-msg]').forEach(function (el) {
      el.addEventListener('click', function () { deleteMessage(el.getAttribute('data-del-msg')); });
    });

    const newThreadInput = document.getElementById('new-thread-input');
    const newThreadBtn = document.getElementById('new-thread-btn');
    newThreadBtn.addEventListener('click', function () {
      const name = newThreadInput.value.trim();
      if (!name) { newThreadInput.focus(); return; }
      newThreadInput.value = '';
      createThread(name);
    });
    newThreadInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') newThreadBtn.click();
    });

    const sendBtn = document.getElementById('c-send');
    const textEl = document.getElementById('c-text');
    if (sendBtn) {
      const doSend = function () {
        const text = textEl.value;
        if (!text.trim()) { textEl.focus(); return; }
        postMessage(text);
      };
      sendBtn.addEventListener('click', doSend);
      textEl.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doSend();
      });
    }
  }

  render();
})();
</script>
</body>
</html>
