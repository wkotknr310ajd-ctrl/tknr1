<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>連絡ノート</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #16213a;
    --surface-2: #1d2b4a;
    --border: #2a3a5c;
    --text: #e6ebf5;
    --text-muted: #93a2c2;
    --primary: #4c7bf3;
    --danger: #ef5164;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #app-root {
    display: flex;
    height: 100vh;
    max-width: 960px;
    margin: 0 auto;
  }
  .thread-pane {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .thread-pane h1 {
    font-size: 1rem;
    margin: 0;
    padding: 0.9rem 1rem 0.5rem;
  }
  .thread-pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-right: 0.7rem;
  }
  .thread-pane-head h1 { flex: 1; }
  #thread-trash-toggle-btn {
    font-size: 0.72rem;
    padding: 0.25rem 0.5rem;
  }
  .trashed-thread {
    cursor: default;
    opacity: 0.8;
  }
  .trashed-thread:hover { background: transparent; }
  .whoami-box {
    padding: 0 1rem 0.8rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .whoami-box label {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .whoami-box select,
  .whoami-box input {
    width: 100%;
  }
  .whoami-row {
    display: flex;
    gap: 0.4rem;
  }
  .whoami-row select {
    flex: 1;
    min-width: 0;
  }
  .whoami-row button {
    flex-shrink: 0;
    padding: 0.5rem 0.7rem;
  }
  .thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .thread-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 0.9rem;
  }
  .thread-item:hover { background: var(--surface-2); }
  .thread-item.active {
    background: var(--surface-2);
    border-color: var(--primary);
  }
  .thread-item-main {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .thread-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .thread-creator {
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .thread-item .thread-del {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.1rem 0.3rem;
    flex-shrink: 0;
  }
  .thread-item:hover .thread-del { opacity: 1; }
  .thread-item .thread-del:hover { color: var(--danger); }
  .new-thread-box {
    padding: 0.6rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
  }
  .new-thread-box input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font-size: 0.85rem;
  }
  .chat-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chat-header {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .chat-header .chat-title {
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chat-header .chat-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .chat-sub-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .chat-sub-row #trash-toggle-btn,
  .chat-sub-row #thread-pw-toggle-btn {
    font-size: 0.72rem;
    padding: 0.25rem 0.55rem;
  }
  .chat-sub-row {
    flex-wrap: wrap;
    gap: 0.4rem 0.5rem;
  }
  .thread-lock-badge {
    margin-right: 0.3rem;
  }
  .thread-pw-panel {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .thread-pw-panel form {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-width: 360px;
  }
  .thread-pw-panel label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
  }
  .thread-pw-panel input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
  }
  .thread-lock-pane {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .msg.trashed {
    opacity: 0.75;
    border-style: dashed;
  }
  .trash-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.4rem;
  }
  .trash-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.4rem;
  }
  .trash-actions button {
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .empty-state {
    color: var(--text-muted);
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    line-height: 1.7;
  }
  .msg {
    max-width: 80%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 0.8rem;
    align-self: flex-start;
  }
  .msg-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .msg-name { font-weight: 600; color: var(--text); }
  .msg-text {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.92rem;
  }
  .msg-del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0;
  }
  .msg-del:hover { color: var(--danger); }
  .composer {
    border-top: 1px solid var(--border);
    padding: 0.8rem;
    display: flex;
    gap: 0.5rem;
  }
  select, textarea, input[type=text] {
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
  }
  .composer textarea {
    flex: 1;
    min-height: 2.6rem;
    max-height: 8rem;
    resize: vertical;
  }
  button {
    font-family: inherit;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 0.55rem 1rem;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { background: var(--border); }
  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .no-thread {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-align: center;
    padding: 1rem;
    line-height: 1.8;
  }
  @media (max-width: 640px) {
    #app-root { flex-direction: column; }
    .thread-pane { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
  }
  .password-gate {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .password-card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
  }
  .password-card h2 {
    margin: 0;
    font-size: 1.1rem;
  }
  .password-card label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.9rem;
  }
  .password-card input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.55rem 0.7rem;
  }
  .password-error {
    color: var(--danger);
    font-size: 0.85rem;
    margin: 0;
  }
  .password-note {
    font-size: 0.8rem;
    margin: 0;
    color: var(--text-muted);
  }
  .password-actions {
    display: flex;
    gap: 0.6rem;
  }
  .password-actions button {
    flex: 1;
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script>
(function () {
  'use strict';
  const root = document.getElementById('app-root');
  const PRESET_NAMES = ['田巻', '羽田', '咲香', '智恵'];
  const THREADS_KEY = 'renraku-note-threads-v1';
  const CURRENT_KEY = 'renraku-note-current-thread-v1';
  const NAME_KEY = 'renraku-note-whoami-v1';
  const MEMBERS_KEY = 'renraku-note-members-v1';
  const MIN_PW_LENGTH = 4;
  const TRASH_DAYS = 10;
  const TRASH_MS = TRASH_DAYS * 24 * 60 * 60 * 1000;

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    const mo = d.getMonth() + 1, da = d.getDate();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return mo + '/' + da + ' ' + hh + ':' + mm;
  }
  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function loadThreads() {
    try {
      const raw = localStorage.getItem(THREADS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveThreads(threads) {
    try { localStorage.setItem(THREADS_KEY, JSON.stringify(threads)); } catch (e) {}
  }
  function loadCurrentId() {
    try { return localStorage.getItem(CURRENT_KEY); } catch (e) { return null; }
  }
  function saveCurrentId(id) {
    try { localStorage.setItem(CURRENT_KEY, id || ''); } catch (e) {}
  }
  function loadWhoAmI() {
    try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
  }
  function saveWhoAmI(name) {
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  }
  function loadMembers() {
    try {
      const raw = localStorage.getItem(MEMBERS_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (e) {}
    return PRESET_NAMES.slice();
  }
  function saveMembers(list) {
    try { localStorage.setItem(MEMBERS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function addMember(name) {
    name = (name || '').trim();
    if (!name) return false;
    if (members.indexOf(name) !== -1) return false;
    members.push(name);
    saveMembers(members);
    return true;
  }

  let threads = loadThreads();
  purgeOldTrash();
  let currentId = loadCurrentId();
  if (!threads.find(function (t) { return t.id === currentId && !t.deletedAt; })) {
    const firstActive = threads.find(function (t) { return !t.deletedAt; });
    currentId = firstActive ? firstActive.id : null;
  }
  let whoAmI = loadWhoAmI();
  let members = loadMembers();
  let showTrash = false;
  let showThreadTrash = false;
  let threadPwMode = null;
  const unlockedThreadIds = new Set();

  function purgeOldTrash() {
    const threshold = Date.now() - TRASH_MS;
    let changed = false;
    const beforeThreadCount = threads.length;
    threads = threads.filter(function (t) {
      return !(t.deletedAt && t.deletedAt < threshold);
    });
    if (threads.length !== beforeThreadCount) changed = true;
    threads.forEach(function (t) {
      const before = t.messages.length;
      t.messages = t.messages.filter(function (m) {
        return !(m.deletedAt && m.deletedAt < threshold);
      });
      if (t.messages.length !== before) changed = true;
    });
    if (changed) saveThreads(threads);
  }

  function currentThread() {
    return threads.find(function (t) { return t.id === currentId; }) || null;
  }

  function requireWhoAmI() {
    if (!whoAmI) {
      alert('まず画面左上で「あなたの名前」を選んでください。');
      return false;
    }
    return true;
  }

  function createThread(name) {
    if (!requireWhoAmI()) return;
    const t = { id: uid(), name: name, createdBy: whoAmI, createdAt: Date.now(), messages: [] };
    threads.push(t);
    saveThreads(threads);
    currentId = t.id;
    saveCurrentId(currentId);
    render();
  }

  function deleteThread(id) {
    const t = threads.find(function (x) { return x.id === id; });
    if (!t) return;
    if (!requireWhoAmI()) return;
    if (t.createdBy !== whoAmI) {
      alert('このスレッドを削除できるのは、作成した「' + t.createdBy + '」さんだけです。');
      return;
    }
    if (!confirm('スレッド「' + t.name + '」を削除します。削除後' + TRASH_DAYS + '日間はゴミ箱に残り、元に戻せます。よろしいですか?')) return;
    t.deletedAt = Date.now();
    t.deletedBy = whoAmI;
    saveThreads(threads);
    if (currentId === id) {
      const remaining = activeThreads();
      currentId = remaining.length ? remaining[0].id : null;
      saveCurrentId(currentId);
    }
    render();
  }

  function restoreThread(id) {
    const t = threads.find(function (x) { return x.id === id; });
    if (!t) return;
    delete t.deletedAt;
    delete t.deletedBy;
    saveThreads(threads);
    render();
  }

  function purgeThreadNow(id) {
    const t = threads.find(function (x) { return x.id === id; });
    if (!t) return;
    if (!confirm('スレッド「' + t.name + '」を完全に削除します。元に戻せなくなります。よろしいですか?')) return;
    threads = threads.filter(function (x) { return x.id !== id; });
    saveThreads(threads);
    render();
  }

  function activeThreads() {
    return threads.filter(function (t) { return !t.deletedAt; });
  }

  function toggleThreadTrash() {
    showThreadTrash = !showThreadTrash;
    render();
  }

  function selectThread(id) {
    currentId = id;
    showTrash = false;
    threadPwMode = null;
    saveCurrentId(currentId);
    render();
  }

  function postMessage(text) {
    if (!requireWhoAmI()) return;
    const t = currentThread();
    if (!t || !text.trim()) return;
    t.messages.push({ id: uid(), from: whoAmI, text: text.trim(), createdAt: Date.now() });
    saveThreads(threads);
    render();
    scrollMessagesToBottom();
  }

  function deleteMessage(msgId) {
    const t = currentThread();
    if (!t) return;
    const m = t.messages.find(function (x) { return x.id === msgId; });
    if (!m) return;
    if (!confirm('このメッセージを削除します。削除後' + TRASH_DAYS + '日間はゴミ箱に残り、元に戻せます。よろしいですか?')) return;
    m.deletedAt = Date.now();
    m.deletedBy = whoAmI || '';
    saveThreads(threads);
    render();
  }

  function restoreMessage(msgId) {
    const t = currentThread();
    if (!t) return;
    const m = t.messages.find(function (x) { return x.id === msgId; });
    if (!m) return;
    delete m.deletedAt;
    delete m.deletedBy;
    saveThreads(threads);
    render();
  }

  function purgeMessageNow(msgId) {
    const t = currentThread();
    if (!t) return;
    if (!confirm('このメッセージを完全に削除します。元に戻せなくなります。よろしいですか?')) return;
    t.messages = t.messages.filter(function (m) { return m.id !== msgId; });
    saveThreads(threads);
    render();
  }

  function toggleTrash() {
    showTrash = !showTrash;
    render();
  }

  function scrollMessagesToBottom() {
    const el = root.querySelector('.chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  }

  function whoAmIBoxHtml() {
    return (
      '<div class="whoami-box">' +
        '<label>あなたの名前</label>' +
        '<div class="whoami-row">' +
          '<select id="whoami-select">' +
            '<option value="">(選択してください)</option>' +
            members.map(function (n) {
              return '<option value="' + esc(n) + '"' + (n === whoAmI ? ' selected' : '') + '>' + esc(n) + '</option>';
            }).join('') +
          '</select>' +
          '<button type="button" id="add-member-btn" title="メンバーを追加">+</button>' +
        '</div>' +
      '</div>'
    );
  }

  function threadListHtml() {
    const list = activeThreads();
    if (!list.length) {
      return '<div class="empty-state" style="margin-top:1rem;">まだスレッドがありません。<br>下から作成してください。</div>';
    }
    return list
      .slice()
      .sort(function (a, b) { return b.createdAt - a.createdAt; })
      .map(function (t) {
        const active = t.id === currentId ? ' active' : '';
        const lockBadge = t.passwordHash ? '<span class="thread-lock-badge">🔒</span>' : '';
        return (
          '<div class="thread-item' + active + '" data-thread-id="' + t.id + '">' +
            '<div class="thread-item-main">' +
              '<span class="thread-name">' + lockBadge + esc(t.name) + '</span>' +
              '<span class="thread-creator">' + esc(t.createdBy) + 'さんが作成</span>' +
            '</div>' +
            '<button class="thread-del" data-del-thread="' + t.id + '" title="削除(作成者のみ)">✕</button>' +
          '</div>'
        );
      })
      .join('');
  }

  function threadTrashHtml() {
    const deleted = threads.filter(function (t) { return !!t.deletedAt; });
    if (!deleted.length) {
      return '<div class="empty-state" style="margin-top:1rem;">ゴミ箱は空です。</div>';
    }
    return deleted
      .slice()
      .sort(function (a, b) { return b.deletedAt - a.deletedAt; })
      .map(function (t) {
        const daysLeft = Math.max(0, Math.ceil((t.deletedAt + TRASH_MS - Date.now()) / 86400000));
        return (
          '<div class="thread-item trashed-thread">' +
            '<div class="thread-item-main">' +
              '<span class="thread-name">' + esc(t.name) + '</span>' +
              '<span class="thread-creator">' + esc(t.deletedBy || '不明') + 'さんが削除・あと' + daysLeft + '日</span>' +
            '</div>' +
            '<div class="trash-actions">' +
              '<button data-restore-thread="' + t.id + '">戻す</button>' +
              '<button data-purge-thread="' + t.id + '">完全削除</button>' +
            '</div>' +
          '</div>'
        );
      })
      .join('');
  }

  function messagesHtml(t) {
    const active = t.messages.filter(function (m) { return !m.deletedAt; });
    if (!active.length) {
      return '<div class="empty-state">まだやり取りがありません。<br>下から投稿してください。</div>';
    }
    return active
      .map(function (m) {
        return (
          '<div class="msg">' +
            '<div class="msg-meta">' +
              '<span class="msg-name">' + esc(m.from) + '</span>' +
              '<span>' + fmtTime(m.createdAt) + '</span>' +
              '<button class="msg-del" data-del-msg="' + m.id + '">削除</button>' +
            '</div>' +
            '<div class="msg-text">' + esc(m.text) + '</div>' +
          '</div>'
        );
      })
      .join('');
  }

  function trashHtml(t) {
    const deleted = t.messages.filter(function (m) { return !!m.deletedAt; });
    if (!deleted.length) {
      return '<div class="empty-state">ゴミ箱は空です。</div>';
    }
    return deleted
      .slice()
      .sort(function (a, b) { return b.deletedAt - a.deletedAt; })
      .map(function (m) {
        const daysLeft = Math.max(0, Math.ceil((m.deletedAt + TRASH_MS - Date.now()) / 86400000));
        return (
          '<div class="msg trashed">' +
            '<div class="msg-meta">' +
              '<span class="msg-name">' + esc(m.from) + '</span>' +
              '<span>' + fmtTime(m.createdAt) + '</span>' +
            '</div>' +
            '<div class="msg-text">' + esc(m.text) + '</div>' +
            '<div class="trash-meta">' + esc(m.deletedBy || '不明') + 'さんが削除・あと' + daysLeft + '日で完全削除</div>' +
            '<div class="trash-actions">' +
              '<button data-restore-msg="' + m.id + '">元に戻す</button>' +
              '<button data-purge-msg="' + m.id + '">今すぐ完全に削除</button>' +
            '</div>' +
          '</div>'
        );
      })
      .join('');
  }

  function threadPwPanelHtml(t) {
    if (threadPwMode === 'set') {
      return (
        '<div class="thread-pw-panel"><form id="thread-pw-form" data-mode="set">' +
          '<p class="password-note">このスレッドにパスワードを設定します。知っている人だけがこのスレッドを見られるようになります。</p>' +
          '<label>パスワード(' + MIN_PW_LENGTH + '文字以上)<input type="password" id="tpw-new" autofocus /></label>' +
          '<label>パスワード(確認)<input type="password" id="tpw-confirm" /></label>' +
          '<div id="tpw-error"></div>' +
          '<div class="password-actions">' +
            '<button type="submit" class="primary">設定する</button>' +
            '<button type="button" id="tpw-cancel">キャンセル</button>' +
          '</div>' +
        '</form></div>'
      );
    }
    if (threadPwMode === 'change') {
      return (
        '<div class="thread-pw-panel"><form id="thread-pw-form" data-mode="change">' +
          '<p class="password-note">現在のパスワードを入力してください。</p>' +
          '<label>現在のパスワード<input type="password" id="tpw-current" autofocus /></label>' +
          '<label>新しいパスワード(変更する場合のみ入力)<input type="password" id="tpw-new" /></label>' +
          '<label>新しいパスワード(確認)<input type="password" id="tpw-confirm" /></label>' +
          '<div id="tpw-error"></div>' +
          '<div class="password-actions">' +
            '<button type="submit" class="primary">変更する</button>' +
            '<button type="button" id="tpw-remove">パスワードを解除する</button>' +
            '<button type="button" id="tpw-cancel">キャンセル</button>' +
          '</div>' +
        '</form></div>'
      );
    }
    return '';
  }

  function threadUnlockHtml(t) {
    return (
      '<div class="thread-lock-pane"><form class="password-card" id="thread-unlock-form">' +
        '<h2>🔒 「' + esc(t.name) + '」にはパスワードが設定されています</h2>' +
        '<label>パスワード<input type="password" id="tpw-unlock" autofocus /></label>' +
        '<div id="tpw-unlock-error"></div>' +
        '<button type="submit" class="primary">開く</button>' +
        '<p class="password-note">パスワードを忘れた場合は、設定した本人に直接聞いてください。</p>' +
      '</form></div>'
    );
  }

  function render() {
    const t = currentThread();
    const deletedThreadCount = threads.filter(function (x) { return !!x.deletedAt; }).length;

    root.innerHTML =
      '<div class="thread-pane">' +
        '<div class="thread-pane-head">' +
          '<h1>💬 連絡ノート</h1>' +
          '<button id="thread-trash-toggle-btn" title="スレッドのゴミ箱">' + (showThreadTrash ? '← 戻る' : '🗑(' + deletedThreadCount + ')') + '</button>' +
        '</div>' +
        whoAmIBoxHtml() +
        '<div class="thread-list">' + (showThreadTrash ? threadTrashHtml() : threadListHtml()) + '</div>' +
        (showThreadTrash
          ? ''
          : (
            '<div class="new-thread-box">' +
              '<input type="text" id="new-thread-input" placeholder="新しいスレッド名" />' +
              '<button id="new-thread-btn">作成</button>' +
            '</div>'
          )
        ) +
      '</div>' +
      '<div class="chat-pane">' +
        (t
          ? (function () {
              const locked = !!t.passwordHash && !unlockedThreadIds.has(t.id);
              if (locked) {
                return (
                  '<div class="chat-header">' +
                    '<div class="chat-title"><span>🔒 ' + esc(t.name) + '</span></div>' +
                  '</div>' +
                  threadUnlockHtml(t)
                );
              }
              const activeCount = t.messages.filter(function (m) { return !m.deletedAt; }).length;
              const trashCount = t.messages.filter(function (m) { return !!m.deletedAt; }).length;
              return (
                '<div class="chat-header">' +
                  '<div class="chat-title">' +
                    '<span>' + esc(t.name) + '</span>' +
                    '<span style="font-size:0.75rem; color: var(--text-muted); font-weight:400;">' + activeCount + '件</span>' +
                  '</div>' +
                  '<div class="chat-sub-row">' +
                    '<span class="chat-sub">作成者: ' + esc(t.createdBy) + '(削除できるのは本人のみ)</span>' +
                    '<button id="thread-pw-toggle-btn">' + (t.passwordHash ? '🔑 パスワード変更/解除' : '🔒 パスワードを設定') + '</button>' +
                    '<button id="trash-toggle-btn">' + (showTrash ? '← 戻る' : '🗑 ゴミ箱(' + trashCount + ')') + '</button>' +
                  '</div>' +
                '</div>' +
                threadPwPanelHtml(t) +
                '<div class="chat-messages">' + (showTrash ? trashHtml(t) : messagesHtml(t)) + '</div>' +
                (showTrash
                  ? ''
                  : (
                    '<div class="composer">' +
                      '<textarea id="c-text" placeholder="メッセージを入力(Ctrl+Enterで送信)"></textarea>' +
                      '<button class="primary" id="c-send">送信</button>' +
                    '</div>'
                  )
                )
              );
            })()
          : '<div class="no-thread">左のスレッド一覧から選ぶか、<br>新しいスレッドを作成してください。</div>'
        ) +
      '</div>';

    scrollMessagesToBottom();

    const whoamiSelect = document.getElementById('whoami-select');
    whoamiSelect.addEventListener('change', function () {
      whoAmI = whoamiSelect.value;
      saveWhoAmI(whoAmI);
      render();
    });
    document.getElementById('add-member-btn').addEventListener('click', function () {
      const name = prompt('追加するメンバーの名前を入力してください');
      if (name === null) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      if (!addMember(trimmed)) { alert('その名前は既に登録されています。'); return; }
      whoAmI = trimmed;
      saveWhoAmI(whoAmI);
      render();
    });

    root.querySelectorAll('[data-thread-id]').forEach(function (el) {
      el.addEventListener('click', function () { selectThread(el.getAttribute('data-thread-id')); });
    });
    root.querySelectorAll('[data-del-thread]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteThread(el.getAttribute('data-del-thread'));
      });
    });
    root.querySelectorAll('[data-restore-thread]').forEach(function (el) {
      el.addEventListener('click', function () { restoreThread(el.getAttribute('data-restore-thread')); });
    });
    root.querySelectorAll('[data-purge-thread]').forEach(function (el) {
      el.addEventListener('click', function () { purgeThreadNow(el.getAttribute('data-purge-thread')); });
    });
    const threadTrashToggleBtn = document.getElementById('thread-trash-toggle-btn');
    if (threadTrashToggleBtn) {
      threadTrashToggleBtn.addEventListener('click', toggleThreadTrash);
    }
    root.querySelectorAll('[data-del-msg]').forEach(function (el) {
      el.addEventListener('click', function () { deleteMessage(el.getAttribute('data-del-msg')); });
    });
    root.querySelectorAll('[data-restore-msg]').forEach(function (el) {
      el.addEventListener('click', function () { restoreMessage(el.getAttribute('data-restore-msg')); });
    });
    root.querySelectorAll('[data-purge-msg]').forEach(function (el) {
      el.addEventListener('click', function () { purgeMessageNow(el.getAttribute('data-purge-msg')); });
    });
    const trashToggleBtn = document.getElementById('trash-toggle-btn');
    if (trashToggleBtn) {
      trashToggleBtn.addEventListener('click', toggleTrash);
    }

    const threadPwToggleBtn = document.getElementById('thread-pw-toggle-btn');
    if (threadPwToggleBtn) {
      threadPwToggleBtn.addEventListener('click', function () {
        const cur = currentThread();
        threadPwMode = cur && cur.passwordHash ? 'change' : 'set';
        render();
      });
    }
    const threadPwForm = document.getElementById('thread-pw-form');
    if (threadPwForm) {
      threadPwForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const cur = currentThread();
        if (!cur) return;
        const mode = threadPwForm.getAttribute('data-mode');
        const errEl = document.getElementById('tpw-error');
        if (mode === 'change') {
          const current = document.getElementById('tpw-current').value;
          const currentHash = await sha256Hex(current);
          if (currentHash !== cur.passwordHash) {
            errEl.innerHTML = '<p class="password-error">現在のパスワードが違います。</p>';
            return;
          }
        }
        const pw = document.getElementById('tpw-new').value;
        const confirmPw = document.getElementById('tpw-confirm').value;
        if (mode === 'change' && !pw && !confirmPw) {
          threadPwMode = null;
          render();
          return;
        }
        if (pw.length < MIN_PW_LENGTH) {
          errEl.innerHTML = '<p class="password-error">パスワードは' + MIN_PW_LENGTH + '文字以上で設定してください。</p>';
          return;
        }
        if (pw !== confirmPw) {
          errEl.innerHTML = '<p class="password-error">2つのパスワードが一致しません。</p>';
          return;
        }
        cur.passwordHash = await sha256Hex(pw);
        saveThreads(threads);
        unlockedThreadIds.add(cur.id);
        threadPwMode = null;
        render();
      });
    }
    const tpwRemoveBtn = document.getElementById('tpw-remove');
    if (tpwRemoveBtn) {
      tpwRemoveBtn.addEventListener('click', async function () {
        const cur = currentThread();
        if (!cur) return;
        const current = document.getElementById('tpw-current').value;
        const currentHash = await sha256Hex(current);
        const errEl = document.getElementById('tpw-error');
        if (currentHash !== cur.passwordHash) {
          errEl.innerHTML = '<p class="password-error">現在のパスワードが違います。</p>';
          return;
        }
        delete cur.passwordHash;
        saveThreads(threads);
        unlockedThreadIds.delete(cur.id);
        threadPwMode = null;
        render();
      });
    }
    const tpwCancelBtn = document.getElementById('tpw-cancel');
    if (tpwCancelBtn) {
      tpwCancelBtn.addEventListener('click', function () {
        threadPwMode = null;
        render();
      });
    }
    const threadUnlockForm = document.getElementById('thread-unlock-form');
    if (threadUnlockForm) {
      threadUnlockForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const cur = currentThread();
        if (!cur) return;
        const pw = document.getElementById('tpw-unlock').value;
        const hash = await sha256Hex(pw);
        if (hash === cur.passwordHash) {
          unlockedThreadIds.add(cur.id);
          render();
        } else {
          document.getElementById('tpw-unlock-error').innerHTML = '<p class="password-error">パスワードが違います。</p>';
        }
      });
    }

    const newThreadInput = document.getElementById('new-thread-input');
    const newThreadBtn = document.getElementById('new-thread-btn');
    if (newThreadBtn) {
      newThreadBtn.addEventListener('click', function () {
        const name = newThreadInput.value.trim();
        if (!name) { newThreadInput.focus(); return; }
        newThreadInput.value = '';
        createThread(name);
      });
      newThreadInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') newThreadBtn.click();
      });
    }

    const sendBtn = document.getElementById('c-send');
    const textEl = document.getElementById('c-text');
    if (sendBtn) {
      const doSend = function () {
        const text = textEl.value;
        if (!text.trim()) { textEl.focus(); return; }
        postMessage(text);
      };
      sendBtn.addEventListener('click', doSend);
      textEl.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doSend();
      });
    }
  }

  render();
})();
</script>
</body>
</html>
